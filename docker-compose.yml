services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17
    container_name: bomi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bomi}
      POSTGRES_USER: ${POSTGRES_USER:-bomi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 의미 검색 벡터 스토어 (S15P11E102-218). 4096차원이라 pgvector 로는 인덱스를
  # 만들 수 없어서 분리했다 — 자세한 이유는 infra/compose.prod.yml 주석 참고.
  #
  # 개발에서는 6333(REST)을 열어 둔다. 대시보드로 컬렉션을 눈으로 확인할 수 있어야
  # "왜 검색이 비었지"를 30초에 판단할 수 있다. 운영에서는 열지 않는다.
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: bomi-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: bomi-mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_BROKER_PORT:-1883}:1883"
      - "9001:9001"
    volumes:
      - ./infra/docker/mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

volumes:
  postgres-data:
  qdrant-data:
  mosquitto-data:
  mosquitto-log:

