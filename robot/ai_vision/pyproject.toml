[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bomi-ai-vision"
version = "0.1.0"
description = "BOMI 돌봄 로봇의 사람 탐지, 추적 및 사용자 상태 분석을 담당하는 AI 비전 패키지"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
"opencv-python>=4.10,<5.0",
"ultralytics>=8.3,<9.0",
]

[project.optional-dependencies]
dev = [
"mypy>=1.10,<2.0",
"pytest>=8.0,<9.0",
"pytest-cov>=5.0,<7.0",
"ruff>=0.6,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bomi_vision*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
"--strict-config",
"--strict-markers",
"-ra",
]
markers = [
"unit: 외부 모델이나 하드웨어 없이 실행하는 단위 테스트",
"integration: 여러 컴포넌트의 연결 동작을 검증하는 통합 테스트",
]

[tool.coverage.run]
branch = true
source = ["bomi_vision"]
omit = [
"tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
"pragma: no cover",
"if TYPE_CHECKING:",
"if __name__ == [\"']__main__[\"']:",
"raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "scripts", "tests"]
extend-exclude = [
"venv",
"artifacts",
"build",
"dist",
]

[tool.ruff.lint]
select = [
"E",
"W",
"F",
"I",
"B",
"UP",
"SIM",
"C4",
"N",
"D",
"RUF",
]
ignore = [
"D203",
"D213",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
"D100",
]
"scripts/check_korean_docstrings.py" = [
"D401",
]
"scripts/check_virtualenv.py" = [
"D401",
]

[tool.ruff.lint.isort]
known-first-party = ["bomi_vision"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 100

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = [
"src/bomi_vision",
"scripts",
]
exclude = [
"^venv/",
"^artifacts/",
"^build/",
"^dist/",
]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
strict_equality = true
