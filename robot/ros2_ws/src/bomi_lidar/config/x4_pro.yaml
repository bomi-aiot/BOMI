# YDLIDAR X4-PRO 초기 실행 설정
#
# 현재 사용 중인 X4-PRO 실기기와 ROS 2 Humble 환경에서
# 정상적인 /scan 발행을 확인한 값이다.
#
# port:
#   기본 개발 환경에서는 /dev/ttyUSB0을 사용한다.
#   장치 번호가 달라지는 환경에서는 launch 인자 port:=... 로 덮어쓴다.
#
# baudrate:
#   현재 X4-PRO 연결에서 정상 통신을 확인한 값이다.
#
# sample_rate, range_min, range_max:
#   현재 센서 테스트에 사용하는 초기값이며,
#   실제 로봇 장착 및 장애물 감지 검증 후 조정할 수 있다.

ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ttyUSB0
    frame_id: laser_frame
    ignore_array: ""
    baudrate: 128000
    lidar_type: 1
    device_type: 0
    isSingleChannel: true
    intensity: false
    intensity_bit: 0
    sample_rate: 5
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: false

    # inverted:
    #   스캔 각도 방향을 반전한다(LidarPropInverted).
    #   false로 두면 스캔이 좌우로 뒤집혀, 로봇이 왼쪽으로 돌 때 스캔 속
    #   세상은 오른쪽으로 돈다. 정지 상태에서는 방 모양이 그럴듯해 보이지만
    #   회전하는 순간 SLAM이 odometry와 반대 방향의 정합을 시도해 지도가
    #   회전마다 돌아간 채로 겹쳐 쌓인다.
    #
    #   2026-08-06 실측(제자리 26초 회전, 연속 스캔 상관으로 실제 회전각을
    #   구해 자이로 적분과 비교):
    #     inverted: false -> 라이다 -384.8°, 자이로 +377.0° (게인 -0.980)
    #     inverted: true  -> 라이다 +361.2°, 자이로 +362.1° (게인 +1.002)
    #   같은 벤더의 params/X4.yaml도 true를 쓴다.
    inverted: true
    auto_reconnect: true
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 10.0
    range_min: 0.12
    frequency: 10.0
    invalid_range_is_inf: false
    debug: false
