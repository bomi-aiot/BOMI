waypoints:
  # LIVING_ROOM(보미야 호출·복약 알림·온습도 안부의 목적지)이 가리키는 지점이다.
  # bridge/waypoint_lookup.py 가 LIVING_ROOM -> sofa 로 매핑한다.
  #
  # 2026-08-07 bomi_real_18 지도의 **출발 지점**과 같은 좌표로 맞췄다.
  # 그렇게 정한 이유는 두 가지다.
  #   1. 좌표계가 다른 옛 지도에서 온 값을 물려받으면 지도 밖 좌표가 된다.
  #      실제로 옛 좌표(0.178, 1.722)가 그래서 지도 범위를 벗어나 있었고,
  #      LIVING_ROOM 을 쓰는 세 시나리오가 전부 "지도 밖" 으로 실패할
  #      상태였다.
  #   2. 출발 지점은 로봇이 실제로 서 있던 자리라 도달 가능성이 이미
  #      실측으로 증명된 유일한 지점이다.
  #
  # 재매핑하면 무효가 된다. bomi_map.sh 가 출발 좌표를 기록할 때 이 값도
  # 함께 갱신하므로, 정상 절차를 따르면 어긋나지 않는다.
  - name: sofa
    x: 0.4577
    y: -0.0709
    yaw: 1.4805

  # 2026-08-07 22:27 bomi_real_18 지도에서 실측(강의장). 로봇을 현관 앞에
  # 세우고 slam_toolbox의 map->base_link TF를 읽었다. 좌표계는
  # bomi_real_18 기준이므로 재매핑하면 무효가 된다.
  #
  # 자이로 영점 보정(config/pico_driver.yaml의 gyro_bias_samples) 이후의
  # 지도다. 보정 전에는 정지 상태에서도 자이로가 초당 1.56° 흘러 회전마다
  # 방이 겹쳐 쌓였고, 그 지도에서 뽑은 좌표는 전부 못 쓴다.
  - name: entrance
    x: -0.9615
    y: -1.3571
    yaw: -1.5569

  # 옛 지도 좌표계에서 온 값이고 bomi_map.sh 의 갱신 대상이 아니다. 어떤
  # 코드도 이 이름을 쓰지 않으므로(bridge 의 목적지 매핑에 없다) 그대로
  # 두지만, 실측 좌표가 아니라는 뜻이다 — 쓰려면 먼저 다시 재야 한다.
  - name: window
    x: -0.665
    y: 0.012
    yaw: 3.14

  # DEFAULT(대기 위치 복귀)가 가리키는 지점이다. bridge의
  # contract.TARGET_DEFAULT 가 이 이름으로 매핑된다
  # (robot/ros2_ws/src/bridge/bridge/waypoint_lookup.py).
  #
  # 2026-08-07 부터 sofa 와 마찬가지로 **출발 지점**과 같은 좌표를 쓴다.
  # 예전에는 지도 원점(0, 0, 0)으로 절차적으로 정의했는데, 그 방식은
  # "재매핑할 때 로봇을 충전소에 도킹한 채로 SLAM 을 시작한다"는 전제에
  # 기대고 있었다. 실제 절차는 그렇지 않고(로봇을 방 가운데 두고 시작한다),
  # 그래서 원점은 아무 의미 없는 지점이 된다.
  #
  # 출발 지점은 로봇이 실제로 서 있던 자리라 도달 가능성이 실측으로
  # 증명돼 있고, 시연에서 대화가 끝난 뒤 돌아갈 대기 자리로도 맞다.
  # bomi_map.sh 가 출발 좌표를 기록할 때 함께 갱신한다.
  - name: charging
    x: 0.4577
    y: -0.0709
    yaw: 1.4805

loop: true
waypoint_delay_sec: 5.0
loop_delay_sec: 30.0
max_goal_retries: 3
goal_retry_delay_sec: 5.0
