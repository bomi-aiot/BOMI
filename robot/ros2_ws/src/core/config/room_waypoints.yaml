waypoints:
  # LIVING_ROOM(보미야 호출·복약 알림·온습도 안부의 목적지)이 가리키는 지점이다.
  # bridge/waypoint_lookup.py 가 LIVING_ROOM -> sofa 로 매핑한다.
  #
  # 2026-08-07 bomi_real_15 지도의 **출발 지점**과 같은 좌표로 맞췄다.
  # 그렇게 정한 이유는 두 가지다.
  #   1. 옛 좌표(0.178, 1.722)는 이 지도의 y 범위(-1.71 ~ +0.64) 밖이었다.
  #      좌표계가 다른 옛 지도에서 온 값이라, 그대로 두면 LIVING_ROOM 을 쓰는
  #      세 시나리오가 전부 "지도 밖" 으로 실패한다.
  #   2. 출발 지점은 로봇이 실제로 서 있던 자리이고 Nav2 가 그 자리에서
  #      경로를 뽑아 현관까지 주행한 것을 확인했다. 즉 도달 가능성이 이미
  #      실측으로 증명된 유일한 지점이다.
  #
  # 재매핑하면 무효가 된다. bomi_map.sh 가 출발 좌표를 기록할 때 이 값도
  # 함께 갱신하므로, 정상 절차를 따르면 어긋나지 않는다.
  - name: sofa
    x: -0.838
    y: -1.136
    yaw: 3.130

  # 2026-08-07 bomi_real_15 지도에서 실측(강의장, 실측 2.73 m x 2.21 m).
  # 로봇을 현관 앞에 세우고 slam_toolbox의 map->base_link TF를 읽었다.
  # 좌표계는 bomi_real_15 기준이므로 재매핑하면 무효가 된다.
  #
  # 이 지도는 자이로 영점 보정(config/pico_driver.yaml의 gyro_bias_samples)을
  # 넣은 뒤 처음으로 회전 겹침 없이 그려진 지도다. 그 전 지도들은 정지
  # 상태에서도 자이로가 초당 1.56° 흘러 회전마다 방이 겹쳐 쌓였다.
  - name: entrance
    x: 0.412
    y: 0.128
    yaw: -0.208

  - name: window
    x: -0.665
    y: 0.012
    yaw: 3.14

  # DEFAULT(대기 위치 복귀)가 가리키는 지점이다. bridge의
  # contract.TARGET_DEFAULT 가 이 이름으로 매핑된다
  # (robot/ros2_ws/src/bridge/bridge/waypoint_lookup.py).
  #
  # 2026-08-07 부터 sofa 와 마찬가지로 **출발 지점**과 같은 좌표를 쓴다.
  # 예전에는 지도 원점(0, 0, 0)으로 절차적으로 정의했는데, 그 방식은
  # "재매핑할 때 로봇을 충전소에 도킹한 채로 SLAM 을 시작한다"는 전제에
  # 기대고 있었다. 실제 절차는 그렇지 않고(로봇을 방 가운데 두고 시작한다),
  # 그래서 원점은 아무 의미 없는 지점이 된다.
  #
  # 출발 지점은 로봇이 실제로 서 있던 자리라 도달 가능성이 실측으로
  # 증명돼 있고, 시연에서 대화가 끝난 뒤 돌아갈 대기 자리로도 맞다.
  # bomi_map.sh 가 출발 좌표를 기록할 때 함께 갱신한다.
  - name: charging
    x: -0.838
    y: -1.136
    yaw: 3.130

loop: true
waypoint_delay_sec: 5.0
loop_delay_sec: 30.0
max_goal_retries: 3
goal_retry_delay_sec: 5.0
