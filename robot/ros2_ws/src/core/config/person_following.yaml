person_follower:
  ros__parameters:
    input_topic: /vision/follow_result
    output_topic: /cmd_vel_follow
    scan_topic: /scan

    linear_speed: 0.15
    # 0.5 -> 0.15. 좌우 보정은 비례제어가 아니라 on/off라, 프레임 간격(~1초,
    # CPU 추론)만큼 이 속도로 계속 돈다. 0.5면 한 번의 판정으로 최대 ~30도
    # 돌아 사람을 지나쳐버린다.
    angular_speed: 0.15
    # 좌우 보정 중에도 직진 속도의 55%로 이동해 자연스러운 곡선 추종을 만든다.
    turn_linear_ratio: 0.55

    # command_timeout_sec/lost_timeout_sec: 1.0 -> 3.0 (2026-08-08 실기).
    # 젯슨은 GPU 드라이버가 낡아 YOLO가 CPU로 폴백되는데, 실측 추론 시간이
    # 프레임당 평균 0.75초다. 카메라 읽기·트래커·UDP 전송 오버헤드까지
    # 더하면 프레임 간격이 1.0초를 넘기기 쉬워서, 매 프레임 사이마다
    # "비전이 끊겼다"고 오판해 target_confirm_sec 을 채우기 전에 후보가
    # 계속 리셋됐다(person_follower.py _check_vision_timeout ->
    # handle_vision_timeout -> _reset_internal 이 후보 확인 타이머를
    # 지운다) — 사람을 찾고도 영원히 waiting_target 에 머무는 원인이었다.
    command_timeout_sec: 3.0
    target_confirm_sec: 0.5
    lost_timeout_sec: 3.0

    multiple_observation_sec: 3.0
    single_recovery_sec: 1.0

    use_lidar: true
    require_lidar_before_motion: true

    person_stop_distance_m: 0.4
    person_resume_distance_m: 0.6
    emergency_stop_distance_m: 0.3

    obstacle_check_half_angle_deg: 20.0
    person_check_half_angle_deg: 8.0

    lidar_timeout_sec: 0.5
