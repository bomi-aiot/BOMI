person_follower:
  ros__parameters:
    input_topic: /vision/follow_result
    output_topic: /cmd_vel_follow
    scan_topic: /scan

    linear_speed: 0.15
    # 가속 제한. 정지 상태에서 곧바로 목표 속도로 튀어나가면 바로 앞에 선
    # 사람에게 위협적으로 느껴진다(2026-08-09 실기 피드백 "좀 무서워").
    # 0.15 m/s 까지 0.5초에 걸쳐 붙는다. 감속·정지는 제한하지 않는다.
    linear_accel_limit: 0.3
    angular_accel_limit: 0.6
    # 0.5 -> 0.15. 좌우 보정은 비례제어가 아니라 on/off라, 프레임 간격(~1초,
    # CPU 추론)만큼 이 속도로 계속 돈다. 0.5면 한 번의 판정으로 최대 ~30도
    # 돌아 사람을 지나쳐버린다.
    angular_speed: 0.15

    # YOLO 가 CPU 로 돌던 시절(프레임 간격 ~1초) 매 프레임 사이마다 "비전이
    # 끊겼다"고 오판하는 것을 막으려 3.0 까지 늘렸던 값이다. 2026-08-09 에
    # GPU 가 살아나 추론이 0.04초로 빨라졌으므로 되돌린다 — 비전이 실제로
    # 죽었을 때 그만큼 빨리 멈춘다.
    command_timeout_sec: 1.0
    target_confirm_sec: 0.5
    lost_timeout_sec: 1.5

    multiple_observation_sec: 3.0
    single_recovery_sec: 1.0

    use_lidar: true
    require_lidar_before_motion: true

    # 이 로봇은 카메라가 종아리 높이라 사람 상자가 늘 화면에 잘려
    # height_ratio 가 0.98~1.00 으로 고정된다(2026-08-09 실측) — 비전으로는
    # 거리를 전혀 구분하지 못하므로 접근 거리는 LiDAR 에만 맡긴다.
    approach_uses_lidar_only: true

    # 비전이 프레임의 20% 를 놓친다(2026-08-09 실측, 9.4FPS). 한 프레임
    # 누락마다 정지를 내보내면 다가가는 내내 가다 서다를 반복한다.
    hold_motion_on_brief_loss: true

    # "보미야" 호출에 응답해 어르신 앞까지 오는 거리. 카메라가 종아리
    # 높이라 박스 크기로는 거리를 못 재므로 접근 정지는 전적으로 LiDAR 가
    # 정한다. 0.2 로 내렸다가 실기에서 몸에 닿을 만큼 붙어 0.4 로 되돌렸다
    # (2026-08-09). 다시 1.5배로 넓혔다 — LiDAR 기준 거리라 로봇 앞면과
    # 사람 사이 실제 간격은 이보다 짧다.
    person_stop_distance_m: 0.6
    person_resume_distance_m: 0.9
    # person_stop_distance_m 이하여야 한다(컨트롤러 검증).
    emergency_stop_distance_m: 0.3

    obstacle_check_half_angle_deg: 20.0
    person_check_half_angle_deg: 8.0

    lidar_timeout_sec: 0.5