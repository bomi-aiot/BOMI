# "보미야" 호출 회전 탐색 설정 (core/core/wake_search.py)
#
# 값의 근거는 core/core/search_policy.py 의 SearchConfig docstring 에 있다.
# 여기서는 실기에서 만질 값과 그 영향만 짧게 적는다.
wake_search:
  ros__parameters:
    # ── 토픽 ────────────────────────────────────────────────────────────────
    # 속도는 twist_mux 를 거쳐 /cmd_vel 로 나간다. 여기에 직접 /cmd_vel 을 넣지
    # 않는다 — person_follower 와 같은 토픽에 동시에 쓰면 명령이 충돌한다.
    cmd_vel_topic: /cmd_vel_search
    follow_enable_topic: /person_following/enable
    # person_follower 가 추종을 포기했을 때만 알려주는 상태 토픽. 엉뚱한
    # 사람을 잠깐 락온했다가 놓쳐도 여기로 신호가 오면 남은 방향 탐색을
    # 이어간다(2026-08-08 실기, 오인식 후 영구 정지 수정).
    follow_status_topic: /person_following/status
    odom_topic: /odom
    vision_topic: /vision/follow_result
    start_topic: /wake_search/start

    # ── 탐색 대본 ───────────────────────────────────────────────────────────
    # 카메라 화각 58도, 가장자리 왜곡을 뺀 유효 화각 45도 기준. 키우면 빨라지지만
    # 스텝 경계에 선 사람을 건너뛴다.
    step_angle_deg: 40.0

    # 제자리 회전 물리 한계는 약 1.11 rad/s 다(pico_driver.yaml 실측값에서 계산).
    # 그 55%. 올리면 탐색은 빨라지지만 모션 블러로 발견율이 떨어진다.
    angular_speed: 0.6
    # 목표 근처 감속의 하한. 너무 낮으면 정지 마찰을 못 이겨 멈춰 선다.
    # 0.15 -> 0.10 (2026-08-08 실기). 힌트 방향으로 정확히 돈 뒤에도 목표를
    # 지나쳐 계속 도는 게 관측됐다 — 초기 방향은 맞았으니 각도 계산·정지
    # 판정 자체는 정상이고(코드 재검토 완료), 감속 구간의 관성으로 몇 도
    # 더 밀리는 쪽으로 보인다. 마찰로 멈추지 않는 선에서 최종 접근을
    # 늦춘다. 그래도 지나치면 odom 스케일(자이로/휠) 실측이 다음 단계다.
    min_angular_speed: 0.10
    # 이 각도 안으로 들어오면 감속을 시작한다. 15 -> 25 — 더 일찍부터
    # 느려져서 목표 근처에서 쌓이는 관성을 줄인다(위 min_angular_speed와
    # 같은 이유).
    slowdown_band_deg: 25.0
    # 위 두 값(min_angular_speed/slowdown_band_deg)은 TURN_TO_HINT(힌트로
    # 도는 단 한 번의 큰 회전, 정밀 착지가 중요)에만 쓴다. 이 값을 스텝
    # 회전에도 그대로 쓰면 40도짜리 스텝의 62%(25도/40도) 구간을 감속만
    # 하다 끝나 "전체 회전이 너무 느리다"는 결과로 이어졌다(2026-08-08
    # 실기). 스텝은 어차피 다음 관찰 지점일 뿐이라 훨씬 늦게, 짧게
    # 감속해도 된다.
    step_min_angular_speed: 0.3
    step_slowdown_band_deg: 10.0
    # 이 오차 안이면 "도착"으로 본다. step_angle_deg 보다 작아야 한다.
    goal_tolerance_deg: 3.0

    # 한 스텝마다 멈춰서 보는 시간. 0.8 -> 1.5 (2026-08-08 실기). 젯슨은 GPU
    # 드라이버가 낡아 YOLO가 CPU로 폴백되는데, 실측 추론 시간이 프레임당
    # 평균 0.75초였다 — 0.8초 관찰 창 안에 추론이 한 번 끝날까 말까 한
    # 수준이라, 카메라가 사람을 비춰도 결과가 안 나온 채 다음 스텝으로
    # 넘어가 버렸다. 카메라 읽기·트래커·UDP 전송 오버헤드까지 더한 여유를
    # 두고 1.5초로 늘렸다. GPU 드라이버를 맞춰 CUDA 가 정상 동작하게
    # 되면 다시 줄일 수 있다.
    observe_duration_sec: 1.5

    # 40도 x 8스텝 = 320도. 관찰 지점이 9곳(0·40·…·320도)이 되어 360도를 모두
    # 덮는다. 360으로 두면 마지막 스텝이 첫 관찰 지점과 겹쳐 시간만 버린다.
    sweep_limit_deg: 320.0

    # 힌트를 중심으로 좌우 지그재그를 몇 차까지 할지(1차 ±1스텝, 2차
    # ±2스텝, …). 2026-08-08 실기: 힌트가 있어도 못 찾으면 곧장 한
    # 방향으로만 계속 돌아서, 마치 힌트를 무시하고 아무 데나 회전하는
    # 것처럼 보였다. "1차, 2차, 그다음 전체 회전"으로 명시적으로 굳혔다.
    local_search_max_steps: 2

    # 못 찾으면 시작 방향으로 되돌아간다(구현계획 결정 B). 다음 호출 때 기준
    # 방향이 일정해진다.
    return_to_start: true

    # ── 시간 상한 ───────────────────────────────────────────────────────────
    # 소리 방향 힌트의 유효 기간. 지나면 힌트 없이 전체 탐색으로 폴백한다.
    hint_max_age_sec: 10.0
    # 추종을 켜 둘 최대 시간(구현계획 결정 C). 대화가 끝나면 ai_chat 이 UDP 로
    # 먼저 끄므로, 이 값은 "대화가 끝나지 않을 때"의 최후 상한이다.
    follow_timeout_sec: 60.0
    # 탐색 전체 상한. observe_duration_sec 을 1.5초로 늘리고 좌우 지그재그로
    # 관찰 지점이 늘면서(힌트 1 + 지그재그 4 + 전체 회전 최대 9곳) 기존
    # 45초는 여유가 빠듯해졌다 — 60초로 늘렸다(2026-08-08 실기).
    search_timeout_sec: 60.0

    # ── 안전 ────────────────────────────────────────────────────────────────
    # 설정 실수로 angular_speed 가 커져도 여기서 한 번 더 자른다.
    max_angular_speed: 1.0
    # /odom 이 이 시간 이상 끊기면 즉시 정지한다. 각도를 모르는 채 돌 수 없다.
    odom_timeout_sec: 0.5
    # 비전 결과가 이 시간 이상 없으면 "사람 없음"으로 본다. 1.0 -> 2.0
    # (2026-08-08 실기). YOLO 추론이 프레임당 ~0.75초라 새 결과 자체가
    # 그만한 간격으로 온다 — 1.0초는 정상 지연과 진짜 끊김을 구분하기에
    # 너무 빠듯해서 사람이 보이는데도 "없음"으로 깜빡일 여지가 있었다.
    vision_timeout_sec: 2.0
    # Pico 의 cmd_vel_timeout_sec 는 0.5초다. 최소 2Hz 는 넘겨야 하며 20Hz 는
    # 10배 여유다.
    publish_rate_hz: 20.0

    # ── 소리 방향 힌트(UDP) ─────────────────────────────────────────────────
    # ai_chat 이 웨이크워드 직후 보낸다. 로봇 내부 통신이므로 루프백에 묶는다.
    hint_bind_host: 127.0.0.1
    hint_bind_port: 5006
    # false 로 두면 힌트를 무시하고 항상 현재 방향부터 전체 탐색한다.
    # 마이크 방향 캘리브레이션(tests/calibrate_beam.py) 전에는 false 를 권한다.
    use_sound_hint: true

    # 어느 신호를 "탐색 시작"으로 인정할지.
    #   topic  백엔드 경유(FOLLOW_START -> bridge -> /wake_search/start)만.
    #          구현계획 결정 1의 정식 경로다.
    #   udp    ai_chat 의 웨이크 신호만. 백엔드·네트워크 없이 시연·개발할 때.
    #   both   둘 다(기본). 백엔드가 FOLLOW_START 로 전환되기 전에도 시나리오를
    #          그대로 돌려 볼 수 있다. 두 신호가 겹쳐도 재시작될 뿐이다.
    start_trigger: both
