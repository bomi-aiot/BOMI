# 거북이 조이스틱 조종 후 추가된 파일
# 조이스틱 방향과 속도 설정을 넣음
joy_node:
  ros__parameters:
    # 몇 번 째 조이스틱을 사용할지
    dev: /dev/input/js0
    # 스틱이 중앙에서 살짝 흔들리는 입력을 무시할 범위
    deadzone: 0.1
    # 조이스틱 상태를 반복해서 보내는 빈도 
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    require_enable_button: false

    # 1번 축 (전,후진)
    axis_linear:
      x: 1
    # 최대 속도 크기
    scale_linear:
      x: 1.0

    # 0번 축 (좌우 회전)
    axis_angular:
      yaw: 0
    # 최대 속도 크기
    scale_angular:
      yaw: 2.0