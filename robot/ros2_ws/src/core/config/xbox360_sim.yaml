# 거북이 조이스틱 조종 후 추가된 파일
# 조이스틱 방향과 속도 설정을 넣음
joy_node:
  ros__parameters:
    # 몇 번 째 조이스틱을 사용할지
    dev: /dev/input/js0
    # 스틱이 중앙에서 살짝 흔들리는 입력을 무시할 범위
    deadzone: 0.1
    # 조이스틱 상태를 반복해서 보내는 빈도 
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    require_enable_button: false

    # 1번 축 (전,후진)
    axis_linear:
      x: 1
    # 0번 축 (좌우 회전)
    axis_angular:
      yaw: 0

    # 스틱을 대각선으로 끝까지 밀어도 바퀴 목표가 최대치(0.8 rev/s)를
    # 넘지 않는 값이다. 넘으면 노드가 좌우를 잘라내므로 명령한 방향과
    # 다르게 움직이고 조작이 먹지 않는 것처럼 느껴진다.
    #
    #   바퀴 목표 = (전진 + 회전 x 트레드/2) / 1회전 거리
    #            = (0.10 + 0.35 x 0.139) / 0.1929 = 0.77 rev/s <= 0.8
    #
    # 회전 0.35 rad/s는 20°/s로, 지도 생성에 권장되는 저속 회전이다.
    # 최고 속도로 달릴 일이 생기면 실측 한계는 0.154 m/s, 1.20 rad/s다.
    scale_linear:
      x: 0.10
    scale_angular:
      yaw: 0.35