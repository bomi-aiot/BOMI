[project]
name = "ai-chat"
version = "0.1.0"
description = "STT-LLM-TTS conversation pipeline for BOMI robot"
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests",
    "python-dotenv",
    "sounddevice",
    "numpy",
    "sentence-transformers>=2.2.0",
    "noisereduce",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]