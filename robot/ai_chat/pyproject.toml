[project]
name = "bomi-ai-chat"
version = "0.1.0"
description = "STT-LLM-TTS conversation pipeline for BOMI robot"
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests",
    "python-dotenv",
    "sounddevice",
    "numpy",
    "sentence-transformers>=2.2.0",
    "noisereduce",
    "psycopg2-binary",
    "sshtunnel",
    "paramiko<3.0",
    # 대화 런타임(graph/, jobs/). CLAUDE.md §6·§22 참고.
    # langgraph-checkpoint-sqlite 는 checkpointer 를 '로봇 로컬' SQLite 에 두기 위한
    # 별도 배포 패키지다. 서버 DB 에 두면 매 턴 네트워크 왕복이 붙어 지연 예산이
    # 무너지고 오프라인에서 죽는다(CLAUDE.md §5).
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    # 침묵 틱·현관 감시·일일 요약의 주기 실행. 실제 시간으로만 발동하므로
    # SimClock 검증에는 jobs/ticks.py 의 틱 함수를 직접 호출한다(README "압축 시계").
    "APScheduler>=3.10",
]

[project.scripts]
bomi-ai-chat = "bomi_ai_chat.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bomi_ai_chat*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["manual"]
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "integration: requires external services such as APIs or databases",
    "manual: requires operator-controlled credentials, hardware, or network access",
]
