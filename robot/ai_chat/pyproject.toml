[project]
name = "bomi-ai-chat"
version = "0.1.0"
description = "STT-LLM-TTS conversation pipeline for BOMI robot"
requires-python = ">=3.10,<3.13"
dependencies = [
    "requests",
    "python-dotenv",
    "sounddevice",
    "numpy",
    "sentence-transformers>=2.2.0",
    "noisereduce",
    'xmltodict',
    'psycopg2-binary',
    'sshtunnel',
    "paramiko<3.0",
]

[project.scripts]
bomi-ai-chat = "bomi_ai_chat.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bomi_ai_chat*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["manual"]
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "integration: requires external services such as APIs or databases",
    "manual: requires operator-controlled credentials, hardware, or network access",
]
