server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name i15e102.p.ssafy.io;
    server_tokens off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        default_type text/plain;
        return 200 'BOMI HTTPS bootstrap';
    }
}
