map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server_tokens off;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream bomi_backend {
    server backend:8080;
    keepalive 32;
}

upstream bomi_frontend {
    server frontend:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name i15e102.p.ssafy.io;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://i15e102.p.ssafy.io$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name i15e102.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/i15e102.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/i15e102.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    location ^~ /actuator {
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    # Shared, read-only API contract docs bundled in Backend, entered from /docs/.
    #
    # Exposed: the landing page, Swagger UI and its configuration, the three
    # live-generated channel groups, the reviewed static OpenAPI specifications,
    # and the MQTT AsyncAPI contract with its viewer.
    #
    # The ungrouped /v3/api-docs endpoint stays private.
    #
    # Read-only applies to the documents themselves. Swagger's "Try it out" posts to
    # /api/ below, which is a separate location and is not restricted here.
    #
    # The AsyncAPI viewers are plain HTML/CSS/JS served from this origin — the CSP
    # above is script-src 'self', so a CDN-hosted renderer would be blocked.
    location ~ ^/(?:docs/?|docs/index\.html|swagger-ui(?:\.html|/.*)|asyncapi/(?:style\.css|mqtt/renderer\.js|(?:mqtt|websocket)(?:/(?:index\.html)?)?)|v3/api-docs/(?:swagger-config|bomi-backend|bomi-robot|bomi-guardian)|openapi/(?:vision-ai|vision-callback|voice-ai)\.openapi\.yaml|openapi/bomi-mqtt\.asyncapi\.(?:yaml|json))$ {
        limit_except GET {
            deny all;
        }

        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://bomi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 가디언웹 채널 단기 접근 제어 (S15P11E102-310).
    #
    # 왜 여기서 막는가 — 가디언웹은 브라우저에서 직접 호출하는 SPA이므로 로봇 채널처럼
    # 공유 비밀(307)을 번들에 넣을 수 없다(브라우저 번들에 박힌 비밀은 비밀이 아니다).
    # 그렇다고 무인증으로 둘 수도 없다 — 이 다섯 접두어는 어르신의 기억(memories),
    # 돌봄기록·복약(care-records), 확인대기 사실(confirmation-requests), 프로필(elders),
    # 대시보드(guardian) 를 반환하거나 수정한다. backend/CLAUDE.md §2 의 채널 표와
    # springdoc bomi-guardian 그룹(application.yml)에 나열된 접두어와 정확히 같다.
    #
    # 이번 티켓 범위는 여기까지다 — 진짜 가디언 로그인·세션은 범위 밖이고(완료 조건에
    # 명시), 이건 그 전까지 무인증 공개를 막는 단기 완화(auth_basic)다. htpasswd 파일은
    # 저장소에 커밋하지 않고 compose.prod.yml 이 볼륨으로 마운트한다(운영 호스트 경로는
    # infra/production.env.example, 생성 절차는 infra/README.md 참고).
    #
    # ★ 로봇 채널(/api/v1/robot/**, /api/v1/seniors/**)은 이 블록과 무관하다. 아래
    #   location /api/ 캐치올을 그대로 타고, 인증은 307 이 애플리케이션 레이어에서
    #   별도로 붙인다 — 서로 다른 메커니즘이라 여기서 섞지 않는다.
    location ~ ^/api/v1/(?:guardian|memories|care-records|confirmation-requests|elders)(?:/.*)?$ {
        auth_basic "BOMI Guardian API";
        auth_basic_user_file /etc/nginx/guardian.htpasswd;

        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://bomi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://bomi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /jenkins {
        return 301 /jenkins/;
    }

    location /jenkins/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $jenkins_upstream http://jenkins:8080;

        proxy_pass $jenkins_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
    }

    location / {
        proxy_pass http://bomi_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
