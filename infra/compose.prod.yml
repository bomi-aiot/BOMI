name: bomi

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg17
    container_name: bomi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ${POSTGRES_DATA_DIR:?POSTGRES_DATA_DIR is required}:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: bomi-backend:${BACKEND_IMAGE_TAG:-local}
    container_name: bomi-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKEND_PORT: 8080
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75.0
        -XX:+ExitOnOutOfMemoryError
        -Duser.timezone=UTC
      MQTT_ENABLED: "true"
      MQTT_BROKER_URL: tcp://mosquitto:1883
      MQTT_CLIENT_ID_PREFIX: bomi-backend-prod
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME is required}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD is required}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    cpus: 1.5
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    networks:
      - backend-net
      - proxy-net
      - bomi-mqtt-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: bomi-frontend:${FRONTEND_IMAGE_TAG:-local}
    container_name: bomi-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/frontend-health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 128m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy-net

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: bomi-jenkins:2.555.3
    container_name: bomi-jenkins
    restart: unless-stopped
    environment:
      JENKINS_OPTS: --prefix=/jenkins
      JAVA_OPTS: >-
        -Xms256m
        -Xmx1536m
        -Djava.awt.headless=true
    group_add:
      - ${DOCKER_GID:?DOCKER_GID is required}
    volumes:
      - ${JENKINS_HOME_DIR:?JENKINS_HOME_DIR is required}:/var/jenkins_home
      - ${JENKINS_HOME_DIR:?JENKINS_HOME_DIR is required}:${JENKINS_HOME_DIR:?JENKINS_HOME_DIR is required}
      - /var/run/docker.sock:/var/run/docker.sock
      - ${BOMI_SOURCE_DIR:-/home/ubuntu/bomi/deploy/source}:${BOMI_SOURCE_DIR:-/home/ubuntu/bomi/deploy/source}
      - ${BOMI_SECRETS_DIR:-/home/ubuntu/bomi/secrets}:${BOMI_SECRETS_DIR:-/home/ubuntu/bomi/secrets}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/jenkins/login"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 2g
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy-net

  nginx:
    image: nginx:1.30.4-alpine
    container_name: bomi-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ${CERTBOT_CONF_DIR:?CERTBOT_CONF_DIR is required}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT_DIR:?CERTBOT_WEBROOT_DIR is required}:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=1m,mode=0755
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy-net

  nginx-bootstrap:
    image: nginx:1.30.4-alpine
    container_name: bomi-nginx-bootstrap
    profiles:
      - tools
    ports:
      - "80:80"
    volumes:
      - ./nginx/bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTBOT_WEBROOT_DIR:?CERTBOT_WEBROOT_DIR is required}:/var/www/certbot:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
    security_opt:
      - no-new-privileges:true

  certbot:
    image: certbot/certbot:v5.7.0
    profiles:
      - tools
    volumes:
      - ${CERTBOT_CONF_DIR:?CERTBOT_CONF_DIR is required}:/etc/letsencrypt
      - ${CERTBOT_WEBROOT_DIR:?CERTBOT_WEBROOT_DIR is required}:/var/www/certbot

networks:
  backend-net:
    name: bomi-backend-net
    internal: true
  proxy-net:
    name: bomi-proxy-net
  bomi-mqtt-net:
    external: true
    name: bomi-mqtt-net
