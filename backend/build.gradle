plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy'
version = '0.1.0-SNAPSHOT'

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

repositories { mavenCentral() }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.integration:spring-integration-mqtt'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    // application-docs.yml 의 "docs" Profile 은 H2 로 뜬다. testRuntimeOnly 만으로는
    // bootRun 클래스패스에 없어서 docs/api/README.md 가 안내하는 로컬 문서 확인
    // 절차가 "Cannot load driver class: org.h2.Driver" 로 죽는다.
    // developmentOnly 는 bootRun 에는 들어가고 bootJar 에는 빠진다.
    developmentOnly 'com.h2database:h2'
    // 실제 PostgreSQL 을 Docker 없이 띄운다. H2 는 배열·JSONB·부분 인덱스 차이를 못 잡으므로
    // "빈 PG 에서 V1~Vn 순차 실행 후 Hibernate validate 통과"는 H2 로 검증할 수 없다.
    testImplementation 'io.zonky.test:embedded-postgres:2.0.7'
    testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:16.2.0')
    testRuntimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') { useJUnitPlatform() }

// 온보딩 질문 세트를 docs/ 에서 가져와 클래스패스에 넣는다.
//
// 왜 복사본을 커밋하지 않는가
//   이 파일은 앱·로봇·백엔드가 공유하는 계약이고, 문서 트리가 유일한 출처다.
//   backend/src/main/resources 에 사본을 두면 문구가 바뀔 때 한쪽만 갱신되고,
//   그것이 동의 문구라면 계약 위반이 된다. 빌드가 매번 가져오면 갈라질 수 없다.
//
// 왜 런타임에 docs/ 를 직접 읽지 않는가
//   배포는 jar 하나이고 그 안에 docs/ 가 없다. 클래스패스 리소스여야 한다.
processResources {
    from("${rootDir}/../docs/database/onboarding-question-set-v1.json") {
        into 'onboarding'
    }
}
