asyncapi: 3.0.0

# BOMI MQTT 메시지 계약.
#
# 시나리오 1~5의 정본은 docs/mqtt/scenario-contract-v1.md 입니다.
# 이 파일은 그 확정 계약을 AsyncAPI 3 형식으로 표현합니다. 두 문서가 충돌하면
# canonical Markdown 인 scenario-contract-v1.md 를 우선하고 이 파일을 정정합니다.
# 공통 토픽 규칙은 docs/mqtt/topic-convention.md 를 함께 참고합니다.
#
# action 은 Backend 관점입니다. receive = Backend 가 구독, send = Backend 가 발행.

info:
  title: "[MQTT] BOMI 로봇·IoT 메시지 계약"
  version: 1.0.0
  description: |
    BOMI 외부 장치와 Spring Boot 사이의 MQTT 통신 계약입니다.

    계약 우선순위
      - 시나리오 1~5의 canonical 문서는 docs/mqtt/scenario-contract-v1.md 입니다.
      - 이 AsyncAPI와 canonical Markdown이 충돌하면 canonical Markdown을 우선합니다.
      - 공통 봉투와 토픽 규칙은 docs/mqtt/topic-convention.md 를 따릅니다.

    Robot 내부의 MQTT Bridge 가 MQTT 메시지와 ROS 2 명령·결과를 변환합니다.
    MQTT Broker 가 ROS 2 노드나 토픽에 직접 연결되는 구조가 아닙니다.

    기본 규칙
      - 토픽 버전은 v1 입니다.
      - payload 는 UTF-8 JSON 객체입니다.
      - 필드 이름은 lowerCamelCase, enum 값은 UPPER_SNAKE_CASE 를 사용합니다.
      - 시각은 타임존을 포함한 ISO 8601 문자열을 사용합니다.
      - 모든 토픽은 retain=false, QoS 1 을 사용하고 수신자는 중복을 허용해야 합니다.
      - 토픽과 payload 에 개인정보·토큰·비밀값을 넣지 않습니다.
      - 영상·음성 바이너리는 MQTT 로 전송하지 않습니다.

    관련 문서
      - 시나리오 1~5 정본: docs/mqtt/scenario-contract-v1.md
      - 산문 계약서: docs/mqtt/topic-convention.md
      - 시나리오: docs/scenario/homecoming-welcome.md
      - REST 계약: /swagger-ui.html

servers:
  production:
    host: "mqtt.internal:1883"
    protocol: mqtt
    description: |
      운영 브로커입니다. 인증과 TLS 를 적용하며 실제 접속 정보는 환경변수 또는
      비밀 저장소로 주입하고 저장소에 커밋하지 않습니다.

defaultContentType: application/json

channels:
  iotEvents:
    address: "bomi/v1/iot/{sourceId}/events"
    title: IoT 센서 이벤트
    description: |
      IoT 센서·Gateway 가 발행하고 Backend 가 구독합니다.
      Backend 구독 패턴은 `bomi/v1/iot/+/events` 입니다.
    parameters:
      sourceId:
        description: 발행 장치 ID. 본문 최상위 sourceId 와 반드시 같아야 합니다.
    messages:
      doorOpened:
        $ref: "#/components/messages/DoorOpened"
      doorClosed:
        $ref: "#/components/messages/DoorClosed"
      motionDetected:
        $ref: "#/components/messages/MotionDetected"
      presenceDetected:
        $ref: "#/components/messages/PresenceDetected"
      ambientEnvironmentObserved:
        $ref: "#/components/messages/AmbientEnvironmentObserved"
      heartbeat:
        $ref: "#/components/messages/Heartbeat"

  robotCommands:
    address: "bomi/v1/robot/{robotId}/commands"
    title: Backend → Robot 명령
    description: Backend 가 발행하고 Robot MQTT Bridge 가 구독합니다.
    parameters:
      robotId:
        description: 대상 Robot ID. 본문 최상위 robotId 와 반드시 같아야 합니다.
    messages:
      navigate:
        $ref: "#/components/messages/Navigate"
      speak:
        $ref: "#/components/messages/Speak"
      cancel:
        $ref: "#/components/messages/Cancel"
      followStart:
        $ref: "#/components/messages/FollowStart"
      followStop:
        $ref: "#/components/messages/FollowStop"

  aiCommands:
    address: "bomi/v1/ai/{robotId}/commands"
    title: Backend → AI 대화 명령
    description: |
      Backend 가 발행하고 해당 Robot 의 AI Chat 런타임이 구독합니다.
      ⑤ 현관, ① 온습도, ② 복약처럼 Backend가 시작하는 능동 대화에 사용합니다.
      ③ 웨이크워드는 AI가 자체 대화를 시작하므로 이 채널에 명령을 발행하지 않습니다.
    parameters:
      robotId:
        description: 대상 Robot ID. 본문 최상위 robotId 와 반드시 같아야 합니다.
    messages:
      startConversation:
        $ref: "#/components/messages/StartConversation"

  robotEvents:
    address: "bomi/v1/robot/{robotId}/events"
    title: Robot·AI 업무 이벤트
    description: |
      Robot MQTT Bridge 또는 해당 Robot의 AI 런타임이 발행하고 Backend 가 구독합니다.
      Backend 구독 패턴은 `bomi/v1/robot/+/events` 입니다.
    parameters:
      robotId:
        description: 발행 Robot ID. 본문 최상위 robotId 와 반드시 같아야 합니다.
    messages:
      wakeWordDetected:
        $ref: "#/components/messages/WakeWordDetected"
      walkRequested:
        $ref: "#/components/messages/WalkRequested"
      onboardingAnswerCaptured:
        $ref: "#/components/messages/OnboardingAnswerCaptured"
      conversationStarted:
        $ref: "#/components/messages/ConversationStarted"
      conversationEnded:
        $ref: "#/components/messages/ConversationEnded"

  robotStatus:
    address: "bomi/v1/robot/{robotId}/status"
    title: Robot 진행 상태
    description: |
      Robot MQTT Bridge 가 발행하고 Backend 가 구독합니다.
      진행 상태는 화면 표시와 관찰 가능성을 위한 정보이며, 최종 성공·실패 판정은
      results 토픽으로 전달합니다. Backend 는 진행 상태만으로 시나리오를
      ARRIVED 또는 실패 상태로 전환하지 않습니다.
    parameters:
      robotId:
        description: 발행 Robot ID. 본문 최상위 robotId 와 반드시 같아야 합니다.
    messages:
      navigationStatus:
        $ref: "#/components/messages/NavigationStatus"
      restStateChanged:
        $ref: "#/components/messages/RestStateChanged"

  robotResults:
    address: "bomi/v1/robot/{robotId}/results"
    title: Robot 최종 결과
    description: |
      Robot MQTT Bridge 가 발행하고 Backend 가 구독합니다.
      명령의 최종 성공·실패 판정입니다.
    parameters:
      robotId:
        description: 발행 Robot ID. 본문 최상위 robotId 와 반드시 같아야 합니다.
    messages:
      navigationResult:
        $ref: "#/components/messages/NavigationResult"
      speakResult:
        $ref: "#/components/messages/SpeakResult"
      cancelResult:
        $ref: "#/components/messages/CancelResult"
      followResult:
        $ref: "#/components/messages/FollowResult"

operations:
  receiveIotEvents:
    action: receive
    channel:
      $ref: "#/channels/iotEvents"
    summary: Backend 가 IoT 센서 이벤트를 구독합니다.
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0

  sendRobotCommand:
    action: send
    channel:
      $ref: "#/channels/robotCommands"
    summary: Backend 가 Robot 에 명령을 발행합니다.
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0

  sendAiCommand:
    action: send
    channel:
      $ref: "#/channels/aiCommands"
    summary: Backend 가 AI Chat 런타임에 능동 대화 시작 명령을 발행합니다.
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0

  receiveRobotEvents:
    action: receive
    channel:
      $ref: "#/channels/robotEvents"
    summary: Backend 가 Robot·AI 업무 이벤트를 구독합니다.
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0

  receiveRobotStatus:
    action: receive
    channel:
      $ref: "#/channels/robotStatus"
    summary: Backend 가 Robot 진행 상태를 구독합니다.
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0

  receiveRobotResults:
    action: receive
    channel:
      $ref: "#/channels/robotResults"
    summary: Backend 가 Robot 최종 결과를 구독합니다.
    bindings:
      mqtt:
        qos: 1
        retain: false
        bindingVersion: 0.2.0

components:
  messages:
    DoorOpened:
      name: DOOR_OPENED
      title: 문 열림 감지
      summary: |
        단일 도어 센서가 현관 문 열림을 감지했을 때 발행합니다. v1에서는 이 이벤트를
        귀가 환영 시나리오의 직접 트리거로 사용합니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/DoorOpenedPayload"
      examples:
        - name: 현관 문 열림
          payload:
            eventId: 01K0M4Y6YQ6B9D2F7H3J5N8RSC
            type: DOOR_OPENED
            occurredAt: "2026-07-21T10:29:59+09:00"
            sourceId: door-sensor-01
            payload:
              location: ENTRANCE

    DoorClosed:
      name: DOOR_CLOSED
      title: 문 닫힘 감지
      summary: |
        도어 센서가 문 닫힘을 감지했을 때 발행합니다. Backend 는 수신·기록하되
        방향 정보가 없으므로 이 이벤트만으로 재실 상태나 시나리오를 변경하지 않습니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/DoorClosedPayload"
      examples:
        - name: 현관 문 닫힘
          payload:
            eventId: 01K0M4Y6YQ6B9D2F7H3J5N8RSD
            type: DOOR_CLOSED
            occurredAt: "2026-07-21T10:30:03+09:00"
            sourceId: door-sensor-01
            payload:
              location: ENTRANCE

    MotionDetected:
      name: MOTION_DETECTED
      title: 현관 움직임 감지
      summary: |
        현관 모션 센서(SONOFF SNZB-03P)가 움직임을 감지했을 때 발행합니다.
        아직 배포된 펌웨어가 발행하지 않습니다. 서버는 준비되어 있으며 이 토픽이
        조용한 동안에는 통과 방향이 판정되지 않을 뿐입니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/MotionDetectedPayload"
      examples:
        - name: 실내 모션
          payload:
            eventId: 01K0MOTION7G1D8W3A9H2T6Q5R
            type: MOTION_DETECTED
            occurredAt: "2026-07-21T10:30:00+09:00"
            sourceId: entrance-motion-01
            payload:
              location: ENTRANCE

    Heartbeat:
      name: HEARTBEAT
      title: 현관 노드 생존 신호
      summary: 라즈베리파이 현관 노드가 살아 있음을 알립니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/HeartbeatPayload"
      examples:
        - name: 현관 노드 생존 확인
          payload:
            eventId: 01K1HEARTBEAT5M2N1Q9R6S3T8
            type: HEARTBEAT
            occurredAt: "2026-08-05T14:00:00+09:00"
            sourceId: entrance-node-01
            payload: {}

    PresenceDetected:
      name: PRESENCE_DETECTED
      title: 사람·이동 방향 판정
      summary: |
        IoT Gateway 가 등록된 센서 조합으로 현관의 사람과 이동 방향을 판정했을 때
        발행합니다. 단일 도어 센서의 문 열림만으로 이 이벤트를 생성해서는 안 됩니다.
        재실 상태나 이동 방향 보조 정보로 사용할 수 있지만, v1 귀가 환영 시나리오의
        직접 트리거는 DOOR_OPENED 입니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/PresenceDetectedPayload"
      examples:
        - name: 귀가 감지
          payload:
            eventId: 01K0M4Y7G1D8W3A9H2T6Q5R4NP
            type: PRESENCE_DETECTED
            occurredAt: "2026-07-21T10:30:00+09:00"
            sourceId: entrance-sensor-hub-01
            payload:
              location: ENTRANCE
              direction: INBOUND
              detectionMethod: SENSOR_SEQUENCE

    AmbientEnvironmentObserved:
      name: AMBIENT_ENVIRONMENT_OBSERVED
      title: 온습도 관측
      summary: |
        온습도 센서 또는 IoT Gateway 가 최신 스냅샷을 발행합니다. 설정된 저주기,
        의미 있는 변화 또는 임계값 초과 시에만 발행하고 초당 원시 스트림을 중앙으로
        보내지 않습니다. Backend 는 occurredAt 이 현재 robot.ambient_observed_at
        보다 새로울 때만 스냅샷을 갱신합니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/AmbientEnvironmentObservedPayload"
      examples:
        - name: 임계값 초과
          payload:
            eventId: 01K0AMBIENT7G1D8W3A9H2T6Q
            type: AMBIENT_ENVIRONMENT_OBSERVED
            occurredAt: "2026-07-23T14:20:00+09:00"
            sourceId: living-room-ambient-01
            payload:
              temperatureC: 29.2
              humidityPercent: 72.0
              reason: THRESHOLD_CROSSED
              policyVersion: ambient-policy-v1

    Navigate:
      name: NAVIGATE
      title: 이동 명령
      summary: |
        target 은 Backend 와 Robot 이 사전에 합의한 논리 위치 이름입니다.
        좌표나 Nav2 세부 파라미터는 MQTT 계약에 노출하지 않고 Robot 설정에서
        해석합니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/NavigateCommand"
      examples:
        - name: 현관 이동
          payload:
            commandId: 01K0M4Y8B7F5M2N1Q9R6S3T8VX
            scenarioId: 6fd94c8c-3903-4a01-a82d-819e0c8edb12
            robotId: 7a4a4cf6-6c8e-4f69-b55b-2a9b94d86c40
            type: NAVIGATE
            occurredAt: "2026-07-21T10:30:01+09:00"
            expiresAt: "2026-07-21T10:31:01+09:00"
            payload:
              target: ENTRANCE

    Speak:
      name: SPEAK
      title: 발화 명령
      summary: |
        SPEAK 은 Robot이 문장 하나를 재생하는 one-way 발화 명령입니다. 사용자의
        응답을 듣거나 대화를 이어 가지 않으며, 수행 여부는 SPEAK_RESULT 로 보고합니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/SpeakCommand"
      examples:
        - name: 단방향 안내
          payload:
            commandId: 01K0M51BR2X6A8D4F9G7H3J5KC
            scenarioId: 6fd94c8c-3903-4a01-a82d-819e0c8edb12
            robotId: 7a4a4cf6-6c8e-4f69-b55b-2a9b94d86c40
            type: SPEAK
            occurredAt: "2026-07-21T10:30:20+09:00"
            expiresAt: "2026-07-21T10:30:50+09:00"
            payload:
              text: 잠시 후 가족과 영상 통화를 연결할게요.

    Cancel:
      name: CANCEL
      title: 취소 명령
      summary: |
        진행 중인 이동 또는 음성 재생을 중단하도록 요청합니다. 취소 명령은 별도의
        commandId 를 사용하고 취소 대상은 targetCommandId 로 지정합니다.
        취소 요청을 받았다는 이유만으로 대상 작업을 성공 처리하지 않습니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/CancelCommand"
      examples:
        - name: 시나리오 타임아웃 취소
          payload:
            commandId: 01K0M53F6C8D2G9H4J1N5Q7RST
            scenarioId: 6fd94c8c-3903-4a01-a82d-819e0c8edb12
            robotId: 7a4a4cf6-6c8e-4f69-b55b-2a9b94d86c40
            type: CANCEL
            occurredAt: "2026-07-21T10:31:01+09:00"
            expiresAt: "2026-07-21T10:31:06+09:00"
            payload:
              targetCommandId: 01K0M4Y8B7F5M2N1Q9R6S3T8VX
              reasonCode: SCENARIO_TIMED_OUT

    FollowStart:
      name: FOLLOW_START
      title: 사람 추종 시작 명령
      summary: |
        산책 시나리오의 실시간 사람 추종을 시작합니다. 시작 판정은 Backend 가 하고,
        추종 제어 루프는 Robot 내부에서 수행합니다. 명령 payload 는 비어 있습니다.
        Backend 는 commandId 와 ack timeout 을 산책 Scenario 에 보존합니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/FollowStartCommand"
      examples:
        - name: 산책 추종 시작
          payload:
            commandId: 01K1FOLLOWSTART7F5M2N1Q9R6S
            scenarioId: 3b1e1ae8-5418-43d5-a108-232437582da1
            robotId: bomi-AA001
            type: FOLLOW_START
            occurredAt: "2026-08-05T16:00:00+09:00"
            expiresAt: "2026-08-05T16:00:10+09:00"
            payload: {}

    FollowStop:
      name: FOLLOW_STOP
      title: 사람 추종 중지 명령
      summary: |
        Backend 가 산책 종료를 판정했을 때 추종을 중지합니다. Robot 이 사용자 요청이나
        사람 놓침으로 자체 종료한 경우에는 활성 FOLLOW_START 의 commandId 로
        FOLLOW_RESULT 를 발행합니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/FollowStopCommand"
      examples:
        - name: 산책 추종 중지
          payload:
            commandId: 01K1FOLLOWSTOP87F5M2N1Q9R6S
            scenarioId: 3b1e1ae8-5418-43d5-a108-232437582da1
            robotId: bomi-AA001
            type: FOLLOW_STOP
            occurredAt: "2026-08-05T16:30:00+09:00"
            expiresAt: "2026-08-05T16:30:10+09:00"
            payload: {}

    StartConversation:
      name: START_CONVERSATION
      title: AI 대화 시작 명령
      summary: |
        Backend 가 시나리오와 대화 식별자를 먼저 발급한 뒤 AI Chat 런타임에 대화
        시작을 요청합니다. AI 는 같은 commandId, scenarioId, conversationId 를
        CONVERSATION_STARTED 의 최상위 필드로 돌려줍니다. ⑤ 현관, ① 온습도,
        ② 복약처럼 Backend가 시작하는 능동 대화에만 사용하며, ③ 웨이크워드에는
        발행하지 않습니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/StartConversationCommand"
      examples:
        - name: 현관 인사 대화 시작
          payload:
            commandId: 01K1CONVSTART7F5M2N1Q9R6S3
            scenarioId: 7fc1dbf8-9e87-4b69-890d-67c9a3c80dc7
            conversationId: 1a4fe41a-6464-4e7e-b292-9a507333a3fa
            robotId: bomi-AA001
            type: START_CONVERSATION
            occurredAt: "2026-08-05T14:00:02+09:00"
            expiresAt: "2026-08-05T14:00:32+09:00"
            payload:
              seniorId: 34fb4e45-65aa-4c64-8474-92931f825e86
              intent: HOMECOMING_GREETING
              text: 다녀오셨어요? 오늘 외출은 어떠셨어요?
              triggerContext:
                sourceId: door-sensor-01
                location: ENTRANCE

    WakeWordDetected:
      name: WAKE_WORD_DETECTED
      title: 웨이크워드 감지
      summary: |
        AI가 "보미" 호출을 감지했을 때 발행합니다. 임시 구현은 STT 결과에
        "보미"가 포함되는지 확인합니다. AI는 호출 직후 자체적으로 대화를 시작하고,
        Backend는 이 이벤트에 대해 FOLLOW_START(payload 없음)만 발행합니다.
        로봇은 좌표로 주행하지 않고 제자리에서 돌며 사람을 찾은 뒤 추종합니다.
        소리 방향은 이 계약에 실을 수 없어(payload 화이트리스트: keyword/confidence)
        로봇 내부 UDP 채널로 전달합니다. FOLLOW_RESULT 는 완료 보고가 아니라
        접수 확인(STARTED)이며, 탐색 성패는 보고하지 않습니다.
        START_CONVERSATION은 발행하지 않으며, 아직 Backend 시나리오가 없으므로
        scenarioId 와 commandId 는 포함하지 않습니다. NAVIGATION_RESULT가 ARRIVED면
        Backend는 호출 시나리오를 완료하며 AI 대화 종료는 완료 조건이 아닙니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/WakeWordDetectedPayload"
      examples:
        - name: 보미 호출
          payload:
            eventId: 01K1WAKE7F5M2N1Q9R6S3T8VXC
            type: WAKE_WORD_DETECTED
            occurredAt: "2026-08-05T14:00:00+09:00"
            robotId: bomi-AA001
            payload:
              keyword: 보미야
              confidence: 0.92

    WalkRequested:
      name: WALK_REQUESTED
      title: 산책 시작·종료 요청
      summary: |
        음성 또는 보호자 앱에서 산책 시작·종료 요청을 감지했을 때 발행합니다. 음성 대화
        중에 발생했다면 conversationId 를 최상위 필드에 포함합니다. Backend 가
        시나리오를 만들기 전이므로 scenarioId 와 commandId 는 포함하지 않습니다.
        Voice MQTT 와 Guardian REST 는 Backend 의 같은 산책 상태 머신을 사용합니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/WalkRequestedPayload"
      examples:
        - name: 음성 산책 요청
          payload:
            eventId: 01K1WALK7F5M2N1Q9R6S3T8VXC
            conversationId: 1a4fe41a-6464-4e7e-b292-9a507333a3fa
            type: WALK_REQUESTED
            occurredAt: "2026-08-05T15:59:58+09:00"
            robotId: bomi-AA001
            payload:
              action: START
              source: VOICE

    OnboardingAnswerCaptured:
      name: ONBOARDING_ANSWER_CAPTURED
      title: 온보딩 답변 캡처
      summary: |
        초기 온보딩에서 한 문항의 답변을 캡처했을 때 발행합니다. 재전송할 때는
        반드시 같은 eventId, sessionId, questionCode 를 유지합니다.
        전체 STT·원본 음성·토큰·프롬프트·모델 응답은 포함하지 않습니다.
        실제 답변 텍스트는 sourceConversationId 와 sourceMessageId 로
        conversation_message 에서 찾습니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/OnboardingAnswerCapturedPayload"
      examples:
        - name: 일과 문항 답변
          payload:
            eventId: 01K0ONBOARD7F5M2N1Q9R6S3T8V
            robotId: 7a4a4cf6-6c8e-4f69-b55b-2a9b94d86c40
            type: ONBOARDING_ANSWER_CAPTURED
            occurredAt: "2026-07-23T10:15:20+09:00"
            payload:
              sessionId: 6c047625-c1d2-4e61-9e70-1c865ec6ac7f
              questionCode: Q04_DAILY_ROUTINE
              sourceConversationId: 1a4fe41a-6464-4e7e-b292-9a507333a3fa
              sourceMessageId: a6f8cb84-c91c-4a38-a7b6-386ce6aa027f
              verificationStatus: UNVERIFIED

    ConversationStarted:
      name: CONVERSATION_STARTED
      title: 대화 시작 확인
      summary: |
        AI Chat 런타임이 START_CONVERSATION 을 수락하고 입력을 받을 준비가 되었을 때
        발행합니다. 관련 식별자는 모두 최상위 필드에 두어 중첩 payload 파싱 없이
        command → scenario → conversation 상관관계를 추적할 수 있게 합니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConversationStartedPayload"
      examples:
        - name: 현관 인사 대화 준비 완료
          payload:
            eventId: 01K1CONVSTARTED5M2N1Q9R6S3T8
            commandId: 01K1CONVSTART7F5M2N1Q9R6S3
            scenarioId: 7fc1dbf8-9e87-4b69-890d-67c9a3c80dc7
            conversationId: 1a4fe41a-6464-4e7e-b292-9a507333a3fa
            robotId: bomi-AA001
            type: CONVERSATION_STARTED
            occurredAt: "2026-08-05T14:00:03+09:00"
            payload:
              intent: HOMECOMING_GREETING

    ConversationEnded:
      name: CONVERSATION_ENDED
      title: 대화 종료
      summary: |
        Backend가 시작한 능동 대화가 끝났을 때 발행합니다. Backend는 scenarioId와
        conversationId로 대화를 찾아 시나리오별 종료 동작을 수행합니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/ConversationEndedPayload"
      examples:
        - name: 인사 종료
          payload:
            eventId: 01K0CONVEND7F5M2N1Q9R6S3T8V
            scenarioId: 7fc1dbf8-9e87-4b69-890d-67c9a3c80dc7
            conversationId: 1a4fe41a-6464-4e7e-b292-9a507333a3fa
            type: CONVERSATION_ENDED
            occurredAt: "2026-08-05T14:01:40+09:00"
            robotId: bomi-AA001
            payload:
              outcome: COMPLETED
              reasonCode: null

    NavigationStatus:
      name: NAVIGATION_STATUS
      title: 이동 진행 상태
      summary: |
        sequence 는 동일한 commandId 안에서 1 부터 단조 증가합니다.
        Backend 는 (commandId, sequence) 를 기준으로 적용하며, 마지막으로 적용한
        값보다 작은 sequence 는 늦게 도착한 이전 상태이므로 무시합니다.
        occurredAt 은 표시와 장애 분석용이며 처리 순서 판정에 사용하지 않습니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/NavigationStatusPayload"
      examples:
        - name: 이동 중
          payload:
            eventId: 01K0M4Z1CT7N9B5V3X2K8P6QRS
            commandId: 01K0M4Y8B7F5M2N1Q9R6S3T8VX
            scenarioId: 6fd94c8c-3903-4a01-a82d-819e0c8edb12
            robotId: 7a4a4cf6-6c8e-4f69-b55b-2a9b94d86c40
            type: NAVIGATION_STATUS
            sequence: 2
            occurredAt: "2026-07-21T10:30:10+09:00"
            payload:
              status: MOVING
              currentLocation: HALLWAY

    RestStateChanged:
      name: REST_STATE_CHANGED
      title: 휴식 상태 전이
      summary: |
        Robot 의 로컬 Vision 이 설정된 지속시간 이상 누움 또는 기상 상태를
        확정했을 때만 발행합니다. 프레임별 자세 후보는 발행하지 않습니다.
        명령 없이 발생하는 백그라운드 이벤트이므로 scenarioId, commandId,
        sequence 를 사용하지 않습니다.

        금지 payload: 이미지·영상·관절 좌표·bounding box·track ID·얼굴 특징·
        프레임별 자세 배열.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/RestStateChangedPayload"
      examples:
        - name: 휴식 진입
          payload:
            eventId: 01K0REST8B7F5M2N1Q9R6S3T8V
            robotId: 7a4a4cf6-6c8e-4f69-b55b-2a9b94d86c40
            type: REST_STATE_CHANGED
            occurredAt: "2026-07-23T13:10:00+09:00"
            payload:
              restState: RESTING
              posture: LYING
              detectionMethod: VISION_POSTURE_DURATION
              detectionDurationSeconds: 600
              confidence: 0.94
              policyVersion: rest-policy-v1
              robotMode: REST_GUARD
        - name: 기상
          payload:
            eventId: 01K0RESTAWAKE5M2N1Q9R6S3T8V
            robotId: 7a4a4cf6-6c8e-4f69-b55b-2a9b94d86c40
            type: REST_STATE_CHANGED
            occurredAt: "2026-07-23T14:02:00+09:00"
            payload:
              restState: AWAKE
              detectionMethod: VISION_POSTURE_DURATION
              confidence: 0.91
              policyVersion: rest-policy-v1
              robotMode: IDLE

    NavigationResult:
      name: NAVIGATION_RESULT
      title: 이동 최종 결과
      summary: |
        공통 판정은 payload.outcome, 도착 여부는 resultCode=ARRIVED 또는
        NOT_ARRIVED 입니다. 실패·취소·시간 초과의 원인은 reasonCode 로 전달합니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/NavigationResultPayload"
      examples:
        - name: 도착
          payload:
            eventId: 01K0M50D4S8V2X6Z1B3N7Q9RTP
            commandId: 01K0M4Y8B7F5M2N1Q9R6S3T8VX
            scenarioId: 6fd94c8c-3903-4a01-a82d-819e0c8edb12
            robotId: 7a4a4cf6-6c8e-4f69-b55b-2a9b94d86c40
            type: NAVIGATION_RESULT
            occurredAt: "2026-07-21T10:30:15+09:00"
            payload:
              outcome: SUCCEEDED
              resultCode: ARRIVED
              reasonCode: null
              location: ENTRANCE
        - name: 경로 막힘
          payload:
            eventId: 01K0M50D4S8V2X6Z1B3N7Q9RTQ
            commandId: 01K0M4Y8B7F5M2N1Q9R6S3T8VX
            scenarioId: 6fd94c8c-3903-4a01-a82d-819e0c8edb12
            robotId: 7a4a4cf6-6c8e-4f69-b55b-2a9b94d86c40
            type: NAVIGATION_RESULT
            occurredAt: "2026-07-21T10:30:15+09:00"
            payload:
              outcome: FAILED
              resultCode: NOT_ARRIVED
              reasonCode: PATH_BLOCKED
              message: 목적지까지 안전한 경로를 찾지 못했습니다.

    SpeakResult:
      name: SPEAK_RESULT
      title: 발화 최종 결과
      summary: |
        공통 판정은 payload.outcome 입니다. 발화 여부는 resultCode=SPOKEN 또는
        NOT_SPOKEN, 실패 원인은 reasonCode 로 구분합니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/SpeakResultPayload"
      examples:
        - name: 재생 완료
          payload:
            eventId: 01K0M528W4Q7B2N6P9R1S3T5VX
            commandId: 01K0M51BR2X6A8D4F9G7H3J5KC
            scenarioId: 6fd94c8c-3903-4a01-a82d-819e0c8edb12
            robotId: 7a4a4cf6-6c8e-4f69-b55b-2a9b94d86c40
            type: SPEAK_RESULT
            occurredAt: "2026-07-21T10:30:25+09:00"
            payload:
              outcome: SUCCEEDED
              resultCode: SPOKEN
              reasonCode: null

    CancelResult:
      name: CANCEL_RESULT
      title: 취소 최종 결과
      summary: |
        Backend 는 CANCEL_RESULT 를 별도 명령 결과로 기록하고 시나리오의 원래
        종료 원인인 TIMED_OUT 또는 CANCELLED 를 덮어쓰지 않습니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/CancelResultPayload"
      examples:
        - name: 취소 성공
          payload:
            eventId: 01K0M53J8P2R4S6T9V1X3Z5BCD
            commandId: 01K0M53F6C8D2G9H4J1N5Q7RST
            scenarioId: 6fd94c8c-3903-4a01-a82d-819e0c8edb12
            robotId: 7a4a4cf6-6c8e-4f69-b55b-2a9b94d86c40
            type: CANCEL_RESULT
            occurredAt: "2026-07-21T10:31:02+09:00"
            payload:
              outcome: SUCCEEDED
              resultCode: TARGET_CANCELLED
              reasonCode: null
              targetCommandId: 01K0M4Y8B7F5M2N1Q9R6S3T8VX

    FollowResult:
      name: FOLLOW_RESULT
      title: 사람 추종 최종 결과
      summary: |
        FOLLOW_START/FOLLOW_STOP 처리 결과 또는 Robot 자체 종료 결과입니다. 모든
        결과는 원래 명령의 commandId 와 scenarioId 를 최상위에 포함합니다. 자체
        종료라면 활성 FOLLOW_START 의 commandId 를 사용합니다.
      contentType: application/json
      payload:
        $ref: "#/components/schemas/FollowResultPayload"
      examples:
        - name: 추종 시작
          payload:
            eventId: 01K1FOLLOWRESULT5M2N1Q9R6S3T
            commandId: 01K1FOLLOWSTART7F5M2N1Q9R6S
            scenarioId: 3b1e1ae8-5418-43d5-a108-232437582da1
            robotId: bomi-AA001
            type: FOLLOW_RESULT
            occurredAt: "2026-08-05T16:00:02+09:00"
            payload:
              outcome: SUCCEEDED
              resultCode: STARTED
              reasonCode: null
        - name: 사람 놓침으로 자체 종료
          payload:
            eventId: 01K1FOLLOWLOSTT5M2N1Q9R6S3T
            commandId: 01K1FOLLOWSTART7F5M2N1Q9R6S
            scenarioId: 3b1e1ae8-5418-43d5-a108-232437582da1
            robotId: bomi-AA001
            type: FOLLOW_RESULT
            occurredAt: "2026-08-05T16:18:02+09:00"
            payload:
              outcome: FAILED
              resultCode: STOPPED
              reasonCode: PERSON_LOST

  schemas:
    # ---------- 공통 식별자 ----------
    EventId:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        논리 이벤트 식별자. 같은 사건을 재전송할 때 같은 값을 유지합니다.
        생산자가 만든 불투명 문자열이며 내부 구조를 해석하지 않습니다. BOMI 시스템
        전체에서 충돌하지 않아야 하고 서로 다른 종류의 ID를 같은 값으로 재사용하지 않습니다.

    CommandId:
      type: string
      minLength: 1
      maxLength: 64
      description: 명령 멱등 키. 명령과 상태·결과를 연결합니다.

    ScenarioId:
      type: string
      format: uuid
      description: Backend 가 생성한 E2E 시나리오 식별자. PostgreSQL scenario.id 입니다.

    ConversationId:
      type: string
      format: uuid
      description: Backend 가 생성한 대화 식별자. PostgreSQL conversation.id 입니다.

    RobotId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9._-]{1,64}$'
      description: Robot deviceId 이며 토픽의 {robotId} 와 같아야 합니다.

    OccurredAt:
      type: string
      format: date-time
      description: |
        이벤트 발생 시각이며 전송 시각이 아닙니다. 타임존을 포함한 ISO 8601 입니다.

        예외: 현관 이벤트의 순서 판정에는 백엔드가 도착 시각을 씁니다. 배터리
        백업 RTC 가 없는 라즈베리파이는 시계가 어긋난 채 부팅할 수 있고, 그 값으로
        순서를 매기면 귀가가 외출로 뒤집히기 때문입니다.

    # ---------- IoT 이벤트 ----------
    DoorOpenedPayload:
      type: object
      required: [eventId, type, occurredAt, sourceId, payload]
      additionalProperties: false
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        type:
          type: string
          const: DOOR_OPENED
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        sourceId:
          type: string
          description: 토픽의 {sourceId} 와 동일한 도어 센서 ID.
        payload:
          type: object
          required: [location]
          properties:
            location:
              $ref: "#/components/schemas/Location"

    DoorClosedPayload:
      type: object
      required: [eventId, type, occurredAt, sourceId, payload]
      additionalProperties: false
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        type:
          type: string
          const: DOOR_CLOSED
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        sourceId:
          type: string
          description: 토픽의 {sourceId} 와 동일한 도어 센서 ID.
        payload:
          type: object
          required: [location]
          additionalProperties: false
          properties:
            location:
              $ref: "#/components/schemas/Location"

    MotionDetectedPayload:
      type: object
      required: [eventId, type, occurredAt, sourceId, payload]
      additionalProperties: false
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        type:
          type: string
          const: MOTION_DETECTED
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        sourceId:
          type: string
          description: 토픽의 {sourceId} 와 동일한 모션 센서 ID.
        payload:
          type: object
          required: [location]
          properties:
            location:
              $ref: "#/components/schemas/Location"

    HeartbeatPayload:
      type: object
      required: [eventId, type, occurredAt, sourceId, payload]
      additionalProperties: false
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        type:
          type: string
          const: HEARTBEAT
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        sourceId:
          type: string
          description: 토픽의 {sourceId} 와 동일한 현관 노드 ID.
        payload:
          type: object
          maxProperties: 0
          additionalProperties: false

    PresenceDetectedPayload:
      type: object
      required: [eventId, type, occurredAt, sourceId, payload]
      additionalProperties: false
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        type:
          type: string
          const: PRESENCE_DETECTED
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        sourceId:
          type: string
          description: 토픽의 {sourceId} 와 동일한 IoT Gateway ID.
        payload:
          type: object
          required: [location, direction, detectionMethod]
          properties:
            location:
              $ref: "#/components/schemas/Location"
            direction:
              type: string
              enum: [INBOUND, OUTBOUND, UNKNOWN]
              description: |
                v1 귀가 환영 시나리오의 직접 트리거로 사용하지 않는 보조 정보입니다.
            detectionMethod:
              type: string
              enum: [SENSOR_SEQUENCE, VISION, MANUAL_OVERRIDE]

    AmbientEnvironmentObservedPayload:
      type: object
      required: [eventId, type, occurredAt, sourceId, payload]
      additionalProperties: false
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        type:
          type: string
          const: AMBIENT_ENVIRONMENT_OBSERVED
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        sourceId:
          type: string
          description: 토픽의 {sourceId} 와 동일한 센서 또는 Gateway ID.
        payload:
          type: object
          required: [temperatureC, humidityPercent]
          properties:
            temperatureC:
              type: number
              description: 섭씨 온도. 장치 지원 범위와 DB CHECK 범위 안의 숫자.
            humidityPercent:
              type: number
              minimum: 0
              maximum: 100
              description: 상대습도 %RH.
            reason:
              type: string
              enum: [PERIODIC, SIGNIFICANT_CHANGE, THRESHOLD_CROSSED, MANUAL_SAMPLE]
            policyVersion:
              type: string
              description: 발행 주기·변화량·임계값을 판정한 운영 정책 버전.

    Location:
      type: string
      description: 등록된 논리 위치. 귀가 시나리오는 ENTRANCE 를 사용합니다.
      examples: [ENTRANCE]

    # ---------- 명령 ----------
    CommandEnvelope:
      type: object
      required: [commandId, scenarioId, robotId, type, occurredAt, expiresAt, payload]
      description: |
        모든 명령의 공통 형태입니다. Robot 은 expiresAt 이 지난 명령을 실행하지 않고
        COMMAND_EXPIRED 실패 결과를 발행합니다. 이미 처리한 commandId 를 다시 받으면
        재실행하지 않고 기존 최종 결과를 다시 발행할 수 있습니다.
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"
        robotId:
          $ref: "#/components/schemas/RobotId"
        type:
          type: string
          enum: [NAVIGATE, SPEAK, CANCEL, FOLLOW_START, FOLLOW_STOP]
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        expiresAt:
          type: string
          format: date-time
          description: Robot 이 명령 실행을 시작할 수 있는 마지막 시각.
        payload:
          type: object

    NavigateCommand:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            type:
              const: NAVIGATE
            payload:
              type: object
              required: [target]
              additionalProperties: false
              properties:
                target:
                  type: string
                  description: |
                    사전에 합의한 논리 위치 이름. 이름→좌표 변환은 Robot 소유의
                    named_waypoints.yaml 에서 수행합니다. 알 수 없는 값은 실패 결과를 냅니다.
                  enum: [LIVING_ROOM, ENTRANCE, DEFAULT]

    SpeakCommand:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            type:
              const: SPEAK
            payload:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text:
                  type: string
                  minLength: 1
                  description: Robot 이 한 번 재생할 문장.

    CancelCommand:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            type:
              const: CANCEL
            payload:
              type: object
              required: [targetCommandId, reasonCode]
              additionalProperties: false
              properties:
                targetCommandId:
                  $ref: "#/components/schemas/CommandId"
                reasonCode:
                  type: string
                  enum:
                    - SCENARIO_TIMED_OUT
                    - USER_CANCELLED
                    - POLICY_CANCELLED
                    - SAFETY_CONDITION_UNCERTAIN

    FollowStartCommand:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            type:
              const: FOLLOW_START
            payload:
              type: object
              maxProperties: 0
              additionalProperties: false

    FollowStopCommand:
      allOf:
        - $ref: "#/components/schemas/CommandEnvelope"
        - type: object
          properties:
            type:
              const: FOLLOW_STOP
            payload:
              type: object
              maxProperties: 0
              additionalProperties: false

    AiCommandEnvelope:
      type: object
      required:
        [commandId, scenarioId, conversationId, robotId, type, occurredAt, expiresAt, payload]
      additionalProperties: false
      description: |
        Backend → AI 명령의 공통 봉투입니다. CONVERSATION_STARTED는 commandId,
        scenarioId, conversationId를 모두 최상위 필드로 echo 합니다.
        CONVERSATION_ENDED 최소 형식은 scenarioId와 conversationId만 사용합니다.
      properties:
        commandId:
          $ref: "#/components/schemas/CommandId"
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"
        conversationId:
          $ref: "#/components/schemas/ConversationId"
        robotId:
          $ref: "#/components/schemas/RobotId"
        type:
          type: string
          enum: [START_CONVERSATION]
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        expiresAt:
          type: string
          format: date-time
          description: AI Chat 런타임이 명령을 수락할 수 있는 마지막 시각.
        payload:
          type: object

    StartConversationCommand:
      allOf:
        - $ref: "#/components/schemas/AiCommandEnvelope"
        - type: object
          properties:
            type:
              const: START_CONVERSATION
            payload:
              type: object
              required: [seniorId, intent, text, triggerContext]
              additionalProperties: false
              properties:
                seniorId:
                  type: string
                  format: uuid
                  description: 대화 개인화 대상인 어르신 ID.
                intent:
                  type: string
                  enum:
                    - WELLNESS_CHECK
                    - MEDICATION_REMINDER
                    - HOMECOMING_GREETING
                text:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: AI가 실제로 먼저 말할 첫 문장.
                triggerContext:
                  type: object
                  description: 대화를 시작하게 한 센서값, 일정 또는 요청 출처의 최소 문맥.

    # ---------- 업무 이벤트 ----------
    WakeWordDetectedPayload:
      type: object
      required: [eventId, robotId, type, occurredAt, payload]
      additionalProperties: false
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        robotId:
          $ref: "#/components/schemas/RobotId"
        type:
          type: string
          const: WAKE_WORD_DETECTED
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        payload:
          type: object
          required: [keyword]
          additionalProperties: false
          properties:
            keyword:
              type: string
              minLength: 1
              maxLength: 20
              pattern: '.*\S.*'
              description: 감지를 확정한 호출어. 원본 STT 문장은 포함하지 않습니다.
            confidence:
              type: number
              minimum: 0
              maximum: 1

    WalkRequestedPayload:
      type: object
      required: [eventId, robotId, type, occurredAt, payload]
      additionalProperties: false
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        conversationId:
          $ref: "#/components/schemas/ConversationId"
          description: VOICE 요청이 대화 중 발생한 경우의 상관관계 ID.
        robotId:
          $ref: "#/components/schemas/RobotId"
        type:
          type: string
          const: WALK_REQUESTED
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        payload:
          type: object
          required: [action, source]
          additionalProperties: false
          properties:
            action:
              type: string
              enum: [START, STOP]
            source:
              type: string
              enum: [VOICE, APP]

    OnboardingAnswerCapturedPayload:
      type: object
      required: [eventId, robotId, type, occurredAt, payload]
      additionalProperties: false
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        robotId:
          $ref: "#/components/schemas/RobotId"
        type:
          type: string
          const: ONBOARDING_ANSWER_CAPTURED
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        payload:
          type: object
          required: [sessionId, questionCode, verificationStatus]
          properties:
            sessionId:
              type: string
              format: uuid
              description: onboarding_session.id.
            questionCode:
              type: string
              description: 세션의 버전 관리 질문 계약에 정의된 문항 코드.
            sourceConversationId:
              type: string
              format: uuid
              description: 단기 원문 출처 conversation UUID. 선택 항목입니다.
            sourceMessageId:
              type: string
              format: uuid
              description: |
                conversation_message.id. 선택 항목이며 Raw 삭제 시 답변 FK 는
                SET NULL 됩니다.
            verificationStatus:
              type: string
              enum:
                - UNVERIFIED
                - AUTO_ACCEPTED
                - USER_CONFIRMED
                - GUARDIAN_CONFIRMED
                - REJECTED

    ConversationStartedPayload:
      type: object
      required:
        [eventId, commandId, scenarioId, conversationId, robotId, type, occurredAt, payload]
      additionalProperties: false
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        commandId:
          $ref: "#/components/schemas/CommandId"
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"
        conversationId:
          $ref: "#/components/schemas/ConversationId"
        robotId:
          $ref: "#/components/schemas/RobotId"
        type:
          type: string
          const: CONVERSATION_STARTED
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        payload:
          type: object
          additionalProperties: false
          required: [intent]
          properties:
            intent:
              type: string
              enum: [WELLNESS_CHECK, MEDICATION_REMINDER, HOMECOMING_GREETING]

    ConversationEndedPayload:
      type: object
      required:
        [eventId, scenarioId, conversationId, robotId, type, occurredAt, payload]
      additionalProperties: false
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"
        conversationId:
          $ref: "#/components/schemas/ConversationId"
        type:
          type: string
          const: CONVERSATION_ENDED
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        robotId:
          $ref: "#/components/schemas/RobotId"
        payload:
          type: object
          required: [outcome, reasonCode]
          additionalProperties: false
          properties:
            outcome:
              type: string
              enum: [COMPLETED, NO_RESPONSE, CANCELLED, FAILED]
            reasonCode:
              type: [string, "null"]
              description: 실패 원인 코드. 원인이 없으면 null.
          allOf:
            - if:
                properties:
                  outcome:
                    const: FAILED
              then:
                properties:
                  reasonCode:
                    type: string
                    minLength: 1

    # ---------- 진행 상태 ----------
    NavigationStatusPayload:
      type: object
      required: [eventId, commandId, scenarioId, robotId, type, sequence, occurredAt, payload]
      additionalProperties: false
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        commandId:
          $ref: "#/components/schemas/CommandId"
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"
        robotId:
          $ref: "#/components/schemas/RobotId"
        type:
          type: string
          const: NAVIGATION_STATUS
        sequence:
          type: integer
          minimum: 1
          description: |
            동일한 commandId 안에서 1 부터 단조 증가합니다.
            sequence 1 은 ACCEPTED, 2 는 MOVING 입니다.
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        payload:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ACCEPTED, MOVING]
            currentLocation:
              type: string

    RestStateChangedPayload:
      type: object
      required: [eventId, robotId, type, occurredAt, payload]
      additionalProperties: false
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        robotId:
          $ref: "#/components/schemas/RobotId"
        type:
          type: string
          const: REST_STATE_CHANGED
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
          description: 후보가 아니라 최종 전이가 확정된 시각.
        payload:
          type: object
          required: [restState, detectionMethod, policyVersion, robotMode]
          properties:
            restState:
              type: string
              enum: [RESTING, AWAKE]
            posture:
              type: string
              enum: [LYING]
              description: RESTING 일 때 필수입니다. MVP 는 LYING 만 사용합니다.
            detectionMethod:
              type: string
              enum: [VISION_POSTURE_DURATION, USER_COMMAND, GUARDIAN_OVERRIDE]
            detectionDurationSeconds:
              type: integer
              description: Vision RESTING 일 때 필수. 임계값을 충족한 실제 지속시간.
            confidence:
              type: number
              minimum: 0
              maximum: 1
              description: Vision 일 때 필수. 최종 판정 신뢰도.
            policyVersion:
              type: string
              description: 지속시간·해제 조건을 적용한 정책 버전.
            robotMode:
              type: string
              description: |
                RESTING 이면 REST_GUARD, AWAKE 이면 IDLE 또는 진행할 허용 모드.
              examples: [REST_GUARD, IDLE]

    # ---------- 최종 결과 ----------
    CommandOutcome:
      type: string
      enum: [SUCCEEDED, FAILED, CANCELLED, TIMED_OUT]
      description: |
        모든 명령 결과의 공통 판정입니다. 성공의 구체적 상태는 resultCode,
        실패·취소·시간 초과의 원인은 reasonCode 로 표현합니다.

    ResultReasonRule:
      type: object
      required: [outcome, reasonCode]
      properties:
        outcome:
          $ref: "#/components/schemas/CommandOutcome"
        reasonCode:
          type: [string, "null"]
      allOf:
        - if:
            properties:
              outcome:
                const: SUCCEEDED
          then:
            properties:
              reasonCode:
                type: "null"
          else:
            properties:
              reasonCode:
                type: string
                minLength: 1

    ResultEnvelope:
      type: object
      required: [eventId, commandId, scenarioId, robotId, type, occurredAt, payload]
      additionalProperties: false
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        commandId:
          $ref: "#/components/schemas/CommandId"
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"
        robotId:
          $ref: "#/components/schemas/RobotId"
        type:
          type: string
          enum: [NAVIGATION_RESULT, SPEAK_RESULT, CANCEL_RESULT, FOLLOW_RESULT]
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        payload:
          type: object

    NavigationResultPayload:
      allOf:
        - $ref: "#/components/schemas/ResultEnvelope"
        - type: object
          properties:
            type:
              const: NAVIGATION_RESULT
            payload:
              type: object
              required: [outcome, resultCode, reasonCode]
              additionalProperties: false
              allOf:
                - $ref: "#/components/schemas/ResultReasonRule"
              properties:
                outcome:
                  $ref: "#/components/schemas/CommandOutcome"
                resultCode:
                  type: string
                  enum: [ARRIVED, NOT_ARRIVED]
                  description: 이동 명령의 최종 도착 여부.
                location:
                  type: string
                  enum: [LIVING_ROOM, ENTRANCE, DEFAULT]
                  description: resultCode=ARRIVED 일 때 도착한 논리 위치.
                reasonCode:
                  type: [string, "null"]
                  enum:
                    - null
                    - COMMAND_EXPIRED
                    - UNKNOWN_TARGET
                    - PATH_BLOCKED
                    - LOCALIZATION_LOST
                    - EXECUTION_TIMEOUT
                    - SAFETY_STOP
                    - INTERNAL_ERROR
                message:
                  type: string

    SpeakResultPayload:
      allOf:
        - $ref: "#/components/schemas/ResultEnvelope"
        - type: object
          properties:
            type:
              const: SPEAK_RESULT
            payload:
              type: object
              required: [outcome, resultCode, reasonCode]
              additionalProperties: false
              allOf:
                - $ref: "#/components/schemas/ResultReasonRule"
              properties:
                outcome:
                  $ref: "#/components/schemas/CommandOutcome"
                resultCode:
                  type: string
                  enum: [SPOKEN, NOT_SPOKEN]
                  description: 발화 명령의 최종 재생 여부.
                reasonCode:
                  type: [string, "null"]
                  enum:
                    - null
                    - COMMAND_EXPIRED
                    - TTS_UNAVAILABLE
                    - EXECUTION_TIMEOUT
                    - INTERNAL_ERROR
                message:
                  type: string

    CancelResultPayload:
      allOf:
        - $ref: "#/components/schemas/ResultEnvelope"
        - type: object
          properties:
            type:
              const: CANCEL_RESULT
            payload:
              type: object
              required: [outcome, resultCode, reasonCode, targetCommandId]
              additionalProperties: false
              allOf:
                - $ref: "#/components/schemas/ResultReasonRule"
              properties:
                outcome:
                  $ref: "#/components/schemas/CommandOutcome"
                resultCode:
                  type: string
                  enum: [TARGET_CANCELLED, TARGET_UNCHANGED]
                  description: 취소 대상에 실제로 적용된 최종 결과.
                targetCommandId:
                  $ref: "#/components/schemas/CommandId"
                reasonCode:
                  type: [string, "null"]
                  enum:
                    - null
                    - COMMAND_EXPIRED
                    - TARGET_NOT_FOUND
                    - NOT_CANCELLABLE
                    - INTERNAL_ERROR
                message:
                  type: string

    FollowResultPayload:
      type: object
      required: [eventId, commandId, scenarioId, robotId, type, occurredAt, payload]
      additionalProperties: false
      description: |
        Robot 자체 종료라면 활성 FOLLOW_START 의 commandId 를 사용합니다. 모든
        FOLLOW_RESULT 는 결과가 답하는 원래 명령의 commandId 를 최상위에 echo 합니다.
      properties:
        eventId:
          $ref: "#/components/schemas/EventId"
        commandId:
          $ref: "#/components/schemas/CommandId"
        scenarioId:
          $ref: "#/components/schemas/ScenarioId"
        robotId:
          $ref: "#/components/schemas/RobotId"
        type:
          type: string
          const: FOLLOW_RESULT
        occurredAt:
          $ref: "#/components/schemas/OccurredAt"
        payload:
          type: object
          required: [outcome, resultCode, reasonCode]
          additionalProperties: false
          allOf:
            - $ref: "#/components/schemas/ResultReasonRule"
          properties:
            outcome:
              $ref: "#/components/schemas/CommandOutcome"
            resultCode:
              type: string
              enum: [STARTED, STOPPED, UNCHANGED]
              description: 추종의 최종 상태 전이.
            reasonCode:
              type: [string, "null"]
              enum:
                - null
                - PERSON_LOST
                - COMMAND_EXPIRED
                - EXECUTION_TIMEOUT
                - SAFETY_STOP
                - INTERNAL_ERROR
            message:
              type: string
