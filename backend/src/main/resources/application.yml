server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: bomi-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bomi}
    username: ${POSTGRES_USER:bomi}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks entity↔schema alignment.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Assumes a fresh (empty) database. If deploying onto an existing schema,
    # set this true so Flyway baselines the current state instead of failing.
    baseline-on-migrate: false
management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  group-configs:
    # 채널별로 나눈다. 같은 백엔드지만 호출 주체가 다르고, 섞어 두면
    # "이건 누가 부르는 API인가"를 스펙만 보고 판단할 수 없다.
    - group: bomi-robot
      display-name: "[BE-Robot] 로봇·AI 채널 API"
      paths-to-match:
        - /api/v1/robot/**
        - /api/v1/seniors/**
    - group: bomi-guardian
      display-name: "[BE-Guardian] 가디언웹 채널 API"
      paths-to-match:
        - /api/v1/guardian/**
        - /api/v1/memories/**
        - /api/v1/care-records/**
        - /api/v1/confirmation-requests/**
        - /api/v1/elders/**
    - group: bomi-backend
      display-name: "[BE-All] 백엔드 전체 API"
      packages-to-scan: com.ssafy.bomi
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    # Try it out 을 켠다. 계약만 있던 시절에는 실수로 연동 API 를 때리지 않도록
    # 비워 두었지만(S15P11E102-63), 이제 로봇·가디언웹 채널은 실제로 동작하므로
    # 브라우저에서 바로 호출해 보는 편이 낫다.
    #
    # 주의: 이 서비스에는 인증이 없다. 배포 Swagger 에서 쓰기 메서드까지 열리므로
    # 문서 주소를 아는 사람은 운영 데이터를 바꿀 수 있다. 발표 기간 한정으로
    # 감수한 결정이며, 외부 공개가 길어지면 문서 경로 인증을 먼저 붙여야 한다.
    supported-submit-methods:
      - get
      - post
      - put
      - patch
      - delete
    # group-configs 의 세 그룹은 springdoc 이 display-name 으로 자동 등록한다.
    # 여기에 다시 적으면 드롭다운에 같은 항목이 두 번 뜬다. 정적 YAML 만 적는다.
    urls:
      - name: "[AI-Vision] 인식 요청 API (계약·미구현)"
        url: /openapi/vision-ai.openapi.yaml
      - name: "[AI-Vision] 결과 Callback API (계약·미구현)"
        url: /openapi/vision-callback.openapi.yaml
      - name: "[AI-Chat] 대화·음성 생성 API (계약·미구현)"
        url: /openapi/voice-ai.openapi.yaml
      # MQTT 계약은 OpenAPI 문법으로 표현할 수 없어 AsyncAPI 뷰어에서 본다.
      # 진입점: /docs/ (docs/api/README.md 참고)
    urls-primary-name: "[BE-Robot] 로봇·AI 채널 API"

bomi:
  homecoming:
    # 문 센서(디바이스 id) → 어르신(UUID) 매핑. IoT 번역기가 발행하는
    # DOOR_OPENED의 sourceId를 해당 어르신 시나리오로 연결한다.
    # 값은 seed-kim-sunja.sql 기준 김순자 UUID.
    sensor-to-senior:
      door_sensor: 10000000-0000-4000-8000-000000000001
  mqtt:
    enabled: ${MQTT_ENABLED:false}
    broker-url: ${MQTT_BROKER_URL:tcp://${MQTT_BROKER_HOST:localhost}:${MQTT_BROKER_PORT:1883}}
    client-id-prefix: ${MQTT_CLIENT_ID_PREFIX:bomi-backend}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    qos: 1
    connection-timeout: 10s
    completion-timeout: 5s
