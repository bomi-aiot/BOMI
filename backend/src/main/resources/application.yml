server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: bomi-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bomi}
    username: ${POSTGRES_USER:bomi}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  integration:
    mqtt:
      broker-url: tcp://${MQTT_BROKER_HOST:localhost}:${MQTT_BROKER_PORT:1883}

management:
  endpoints:
    web:
      exposure:
        include: health,info
