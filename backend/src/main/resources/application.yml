server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: bomi-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bomi}
    username: ${POSTGRES_USER:bomi}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks entity↔schema alignment.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Assumes a fresh (empty) database. If deploying onto an existing schema,
    # set this true so Flyway baselines the current state instead of failing.
    baseline-on-migrate: false
management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  group-configs:
    # 채널별로 나눈다. 같은 백엔드지만 호출 주체가 다르고, 섞어 두면
    # "이건 누가 부르는 API인가"를 스펙만 보고 판단할 수 없다.
    - group: bomi-robot
      display-name: "[BE-Robot] 로봇·AI 채널 API"
      paths-to-match:
        - /api/v1/robot/**
        - /api/v1/seniors/**
    - group: bomi-guardian
      display-name: "[BE-Guardian] 가디언웹 채널 API"
      paths-to-match:
        - /api/v1/guardian/**
        - /api/v1/memories/**
        - /api/v1/care-records/**
        - /api/v1/confirmation-requests/**
        - /api/v1/elders/**
    - group: bomi-backend
      display-name: "[BE-All] 백엔드 전체 API"
      packages-to-scan: com.ssafy.bomi
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    # Try it out 은 읽기(GET)만 허용한다 (S15P11E102-310).
    #
    # 이 서비스에는 인증이 없다(가디언웹 채널은 nginx 단기 완화만 걸려 있고,
    # 로봇 채널은 별도 티켓 307 에서 공유 비밀로 막는다). 예전에는 쓰기 메서드까지
    # 전부 열어 뒀는데(S15P11E102-63 에서 계약 검토용으로 켠 뒤 그대로 방치),
    # 그 상태에서는 배포 문서 주소를 아는 사람이 DELETE 버튼 하나로 어르신의
    # 복약 스케줄(`CareRecordController#deleteMedication`)을 지울 수 있었다.
    #
    # supportedSubmitMethods 는 springdoc 설정이 아니라 swagger-ui 자체의 표준
    # 옵션이다(springdoc 은 이 값을 그대로 swagger-ui 초기화 스크립트에 넘긴다).
    # 여기 없는 메서드는 오퍼레이션이 계속 문서에 나열되고 스키마도 그대로
    # 보이지만 "Try it out" 버튼이 없어 브라우저에서 실행할 수 없다 — 문서로서의
    # 가치는 유지하고 파괴적 실행만 막는다.
    supported-submit-methods:
      - get
    # group-configs 의 세 그룹은 springdoc 이 display-name 으로 자동 등록한다.
    # 여기에 다시 적으면 드롭다운에 같은 항목이 두 번 뜬다. 정적 YAML 만 적는다.
    urls:
      - name: "[AI-Vision] 인식 요청 API (계약·미구현)"
        url: /openapi/vision-ai.openapi.yaml
      - name: "[AI-Vision] 결과 Callback API (계약·미구현)"
        url: /openapi/vision-callback.openapi.yaml
      - name: "[AI-Chat] 대화·음성 생성 API (계약·미구현)"
        url: /openapi/voice-ai.openapi.yaml
      # MQTT 계약은 OpenAPI 문법으로 표현할 수 없어 AsyncAPI 뷰어에서 본다.
      # 진입점: /docs/ (docs/api/README.md 참고)
    urls-primary-name: "[BE-Robot] 로봇·AI 채널 API"

bomi:
  homecoming:
    # 문 센서(디바이스 id) → 어르신(UUID) 매핑. IoT 번역기가 발행하는
    # DOOR_OPENED의 sourceId를 해당 어르신 시나리오로 연결한다.
    # 값은 seed-kim-sunja.sql 기준 김순자 UUID.
    sensor-to-senior:
      door_sensor: 10000000-0000-4000-8000-000000000001
  observation:
    # 온습도 센서(디바이스 id) → 어르신(UUID) 매핑. IoT가 발행하는
    # AMBIENT_ENVIRONMENT_OBSERVED의 sourceId를 해당 어르신에게 연결한다.
    # 이 매핑이 없으면 온습도 이벤트가 기록되지 않는다(미등록 센서는 경고 후 폐기).
    # 값은 seed-kim-sunja.sql 기준 김순자 UUID.
    ambient-sensor-to-senior:
      ambient-sensor-01: 10000000-0000-4000-8000-000000000001
  medication-reminder:
    # 복약 알림 창의 뒤쪽 유예(분): 예정 시각 + 이 값까지는 알릴 가치가 있다고 본다.
    # 창을 넘긴 슬롯은 침묵한다 — 한참 지난 약을 뒤늦게 알리는 것은 혼란이다.
    # 앞쪽(미리 알림)은 기록별 reminderLeadMinutes 가 담당한다.
    grace-minutes: ${MEDICATION_GRACE_MINUTES:15}
  wellness:
    # 온습도 안부 확인(WELLNESS_CHECK) 임계값. 이 값 이상이면 로봇이 이동해
    # 안부를 묻는다. 시연 연출(드라이기 등)로 유발 가능한 수준이 기본값.
    temperature-threshold-c: ${WELLNESS_TEMP_THRESHOLD:30.0}
    humidity-threshold-percent: ${WELLNESS_HUMIDITY_THRESHOLD:80.0}
    # 같은 어르신에게 완료 후 재시작 금지 시간(분). 온습도는 연속 신호라 필수.
    cooldown-minutes: ${WELLNESS_COOLDOWN_MINUTES:30}
  # 의미 검색 벡터 스토어 (S15P11E102-218).
  #
  # host 가 비면 의미 검색이 꺼진 채로 뜬다. 지원되는 상태다 — 기억 조회가
  # 키워드 x 중요도 x 최근성으로 내려앉을 뿐이고, 기동 로그에 남는다.
  # 개발 노트북에 컨테이너가 없어도 앱은 떠야 한다.
  qdrant:
    host: ${QDRANT_HOST:}
    # gRPC 포트다. 6333(REST)을 넣으면 프로토콜 오류가 네트워크 문제처럼 보인다.
    grpc-port: ${QDRANT_GRPC_PORT:6334}
    api-key: ${QDRANT_API_KEY:}
    use-tls: ${QDRANT_USE_TLS:false}
    # 임베딩 모델과 정확히 같아야 한다. 이 숫자가 pgvector 를 불가능하게 만든 값이다.
    dimensions: ${QDRANT_DIMENSIONS:4096}
    timeout-millis: ${QDRANT_TIMEOUT_MILLIS:1500}

  # 임베딩 모델 (S15P11E102-218).
  #
  # ★ 기본값이 전부 꺼짐이다. 백엔드에서 유일하게 과금되는 외부 API 이고, 프로젝트
  #   잔액이 프로토타입 시연까지 감당해야 한다. 기본값이 켜짐이면 테스트 실행·로컬
  #   기동·CI 잡이 전부 돈을 쓴다. 켜는 것은 배포 env 한 줄이고, 소진된 잔액을
  #   되돌리는 방법은 없다.
  embedding:
    enabled: ${EMBEDDING_ENABLED:false}
    api-key: ${UPSTAGE_API_KEY:}
    base-url: ${UPSTAGE_BASE_URL:https://api.upstage.ai/v1}
    # 저장은 passage, 검색은 query. 섞으면 예외 없이 검색 품질만 조용히 나빠진다.
    passage-model: ${UPSTAGE_PASSAGE_MODEL:embedding-passage}
    query-model: ${UPSTAGE_QUERY_MODEL:embedding-query}
    dimensions: ${EMBEDDING_DIMENSIONS:4096}
    timeout-millis: ${EMBEDDING_TIMEOUT_MILLIS:1200}
    # 한 행 = 과금 1회. 이것은 튜닝 값이 아니라 지출 상한이다.
    sync-batch-size: ${EMBEDDING_SYNC_BATCH_SIZE:30}
    # 배경 잡은 별도로 켠다. 시연 중에는 질의 임베딩만 돌고 백로그를 훑지 않게 한다.
    sync-enabled: ${EMBEDDING_SYNC_ENABLED:false}
    sync-interval-millis: ${EMBEDDING_SYNC_INTERVAL_MILLIS:300000}

  mqtt:
    enabled: ${MQTT_ENABLED:false}
    broker-url: ${MQTT_BROKER_URL:tcp://${MQTT_BROKER_HOST:localhost}:${MQTT_BROKER_PORT:1883}}
    client-id-prefix: ${MQTT_CLIENT_ID_PREFIX:bomi-backend}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    qos: 1
    connection-timeout: 10s
    completion-timeout: 5s
