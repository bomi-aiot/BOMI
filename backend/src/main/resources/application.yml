server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: bomi-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bomi}
    username: ${POSTGRES_USER:bomi}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  integration:
    mqtt:
      broker-url: tcp://${MQTT_BROKER_HOST:localhost}:${MQTT_BROKER_PORT:1883}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
  group-configs:
    - group: bomi-backend
      display-name: BOMI Backend API
      packages-to-scan: com.ssafy.bomi
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    supported-submit-methods: []
    urls:
      - name: BOMI Backend API
        url: /v3/api-docs/bomi-backend
      - name: AI Vision Recognition API
        url: /openapi/vision-ai.openapi.yaml
      - name: AI Vision Result Callback API
        url: /openapi/vision-callback.openapi.yaml
      - name: Conversation and Voice AI API
        url: /openapi/voice-ai.openapi.yaml
    urls-primary-name: BOMI Backend API
