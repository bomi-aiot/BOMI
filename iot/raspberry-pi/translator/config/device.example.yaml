# Raspberry Pi IoT 번역기 설정 예시
#
# 이 파일은 예시다. 실제 값은 device.yaml 로 복사해서 쓰고 커밋하지 않는다.
# 번역기는 GPIO 를 직접 읽지 않는다. Zigbee2MQTT 가 브로커로 발행한 센서
# 메시지(zigbee2mqtt/<friendly_name>)를 구독해, 백엔드 계약 형식
# (bomi/v1/iot/<sourceId>/events)으로 변환·재발행한다.

mqtt:
  host: localhost              # 번역기는 Pi 로컬 브로커(Mosquitto)에 붙는다
  port: 1883
  # username: change-me        # 운영 브로커 인증 사용 시 (커밋 금지)
  # password: change-me
  qos: 1                       # 계약: inbound 는 QoS 1
  retain: false                # 계약: retain 금지

topics:
  zigbee2mqtt_base: zigbee2mqtt  # Zigbee2MQTT 발행 토픽 접두 (구독 대상)
  contract_prefix: bomi/v1       # 백엔드 계약 토픽 접두 (발행 대상)

# 이 Pi 가 담당하는 센서 목록. Zigbee2MQTT 에 등록된 friendly_name 을
# 계약 sourceId 로 매핑한다. sourceId 는 백엔드 설정과 연결되므로 불변.
sensors:
  - friendly_name: door_sensor        # Zigbee2MQTT 이름 (zigbee2mqtt/door_sensor)
    source_id: door_sensor            # 계약 토픽/봉투의 sourceId (불변)
    kind: door                        # door | pir | ambient
    location: ENTRANCE
    # contact=false(문 열림) -> DOOR_OPENED, contact=true(문 닫힘) -> DOOR_CLOSED
    #   ※ 백엔드의 sensorId->senior 매핑도 이 source_id(door_sensor)로 맞춰야 함

  - friendly_name: pir                # Zigbee2MQTT 이름 (zigbee2mqtt/pir)
    source_id: pir
    kind: pir
    location: ENTRANCE
    # occupancy=true -> type=MOTION_DETECTED
    #   payload.direction=UNKNOWN (문+PIR 1개로는 방향 확정 불가, MVP)
    #   payload.detectionMethod=SENSOR_SEQUENCE
    #   ※ PRESENCE_DETECTED는 방향 판정 결과용 예약어라 직접 발행하지 않는다.

  # 온습도 센서를 붙일 때 예시 (선택)
  # - friendly_name: living-room-ambient-01
  #   source_id: living-room-ambient-01
  #   kind: ambient
  #   location: LIVING_ROOM
  #   # temperature/humidity -> type=AMBIENT_ENVIRONMENT_OBSERVED
