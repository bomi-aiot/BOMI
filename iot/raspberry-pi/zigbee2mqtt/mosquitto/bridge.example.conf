# Raspberry Pi 로컬 Mosquitto -> EC2 운영 Mosquitto 단방향 Bridge
connection bomi-ec2-iot
address i15e102.p.ssafy.io:8883

remote_username bomi-iot-gateway
remote_password REPLACE_WITH_DEVICE_LOCAL_PASSWORD

bridge_protocol_version mqttv311
start_type automatic
cleansession false
notifications false
try_private false
bridge_outgoing_retain false

# Let's Encrypt 서버 인증서를 시스템 CA로 검증한다.
bridge_tls_use_os_certs true
bridge_tls_version tlsv1.2
bridge_insecure false

# 정규화된 IoT 계약 이벤트만 EC2로 QoS 1 전달한다.
topic bomi/v1/iot/+/events out 1
